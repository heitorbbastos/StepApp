<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepQuest — Expedição pelo Tempo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --pt:#E91E63; --mt:#2196F3; --hi:#FF9800; --ge:#4CAF50; --ci:#9C27B0;
    --ouro:#FFC107; --ok:#2e9e5b; --erro:#e0443e;
  }
  html,body{ height:100%; }
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:#15123a;
    background:
      radial-gradient(900px 500px at 12% -8%, #4a2f86 0%, transparent 55%),
      radial-gradient(1000px 600px at 88% 0%, #2b6fb0 0%, transparent 50%),
      linear-gradient(180deg,#1d1748 0%,#140f33 100%);
    background-attachment:fixed;
    color:#fff; min-height:100%;
  }
  #app{ max-width:760px; margin:0 auto; padding:14px 14px 64px; animation:fadein .35s ease; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  h1,h2,h3{ line-height:1.2; }
  button{ font-family:inherit; cursor:pointer; border:none; transition:transform .08s ease, filter .15s; }
  button:active{ transform:scale(.97); }
  .hide{ display:none !important; }

  /* ---- cartão genérico ---- */
  .card{ background:#fff; color:#2a2350; border-radius:20px; padding:16px; margin:12px 0;
    box-shadow:0 10px 28px rgba(10,5,40,.35); border:1px solid rgba(255,255,255,.5); }

  /* ---- guia (personagem) ---- */
  .cronos{ display:flex; gap:12px; align-items:flex-start; margin:6px 0; }
  .cronos .face{ font-size:30px; flex:0 0 auto; width:54px; height:54px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%,#fff,#efe9ff);
    box-shadow:0 4px 12px rgba(80,40,160,.3), inset 0 0 0 3px #fff, inset 0 0 0 5px #d9ccff; }
  .cronos .balao{ background:linear-gradient(180deg,#fffae6,#fff3cf); color:#5b4a00;
    border:2px solid #ffd84d; border-radius:16px; padding:11px 13px; font-size:14.5px;
    position:relative; flex:1; box-shadow:0 3px 10px rgba(150,110,0,.12); }
  .cronos .balao:before{ content:''; position:absolute; left:-9px; top:18px; width:0; height:0;
    border:8px solid transparent; border-right-color:#ffd84d; }
  .cronos .balao b{ color:#a06b00; }

  /* ---- abertura ---- */
  .logo{ text-align:center; padding:18px 0 4px; }
  .logo .big{ font-size:42px; font-weight:800; letter-spacing:.5px;
    background:linear-gradient(90deg,#ffd84d,#ff8fc8,#7ec8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .logo .sub{ color:#c9c2f0; font-size:15px; margin-top:2px; }
  .campo{ width:100%; padding:12px; border-radius:12px; border:2px solid #d8d3f0;
    font-size:16px; color:#2a2350; margin-top:6px; }
  .chars{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0; }
  .char{ background:#f1eefb; border:3px solid transparent; border-radius:14px;
    padding:10px 4px; text-align:center; color:#2a2350; font-size:12px; font-weight:600; }
  .char .e{ font-size:32px; display:block; }
  .char.sel{ border-color:var(--pt); background:#fff; }
  .btn{ display:block; width:100%; padding:14px; border-radius:14px; font-size:17px;
    font-weight:700; color:#fff; background:linear-gradient(90deg,#7b4dff,#b14dff);
    box-shadow:0 6px 16px rgba(120,70,255,.35); }
  .btn:disabled{ opacity:.45; box-shadow:none; }
  .btn.lg{ margin-top:10px; }
  .btn.sec{ background:#ece9f7; color:#5a4fae; box-shadow:none; }

  /* ---- topo / HUD ---- */
  .hud{ display:flex; align-items:center; gap:10px; background:#241f52;
    border:1px solid #423a7e; border-radius:16px; padding:10px 12px; }
  .hud .av{ font-size:24px; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%,#5b4bb0,#37306f); box-shadow:inset 0 0 0 2px #6b5cc8; }
  .hud .who{ flex:1; min-width:0; }
  .hud .who .nm{ font-weight:700; font-size:15px; }
  .hud .who .lv{ font-size:12px; color:#bdb4ee; }
  .xpbar{ height:9px; background:#3a3370; border-radius:6px; overflow:hidden; margin-top:4px; }
  .xpbar i{ display:block; height:100%; background:linear-gradient(90deg,#ffd84d,#ff8fc8); }
  .streak{ background:#3a3370; border-radius:12px; padding:6px 10px; font-weight:700;
    font-size:14px; white-space:nowrap; }

  .titulo{ font-size:20px; margin:16px 4px 4px; }
  .lead{ color:#c9c2f0; font-size:13.5px; margin:0 4px; }

  /* ---- missão do dia ---- */
  .hoje{ background:linear-gradient(120deg,#ffb74d,#ff8a65); color:#3a2200;
    border-radius:18px; padding:14px; margin:12px 0; }
  .hoje .lab{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; opacity:.8; }
  .hoje .ms{ font-size:17px; font-weight:800; margin:2px 0 8px; }
  .hoje button{ background:#3a2200; color:#ffd; padding:9px 14px; border-radius:10px; font-weight:700; }

  /* ---- mapa: territórios ---- */
  .terrs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .terr{ border-radius:20px; padding:15px; color:#fff; position:relative; overflow:hidden;
    min-height:128px; box-shadow:0 8px 20px rgba(0,0,0,.32); }
  .terr:after{ content:''; position:absolute; right:-22px; top:-22px; width:92px; height:92px;
    background:rgba(255,255,255,.12); border-radius:50%; }
  .terr .em{ font-size:32px; width:52px; height:52px; border-radius:14px; position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.22); box-shadow:inset 0 0 0 1px rgba(255,255,255,.3); }
  .terr .nm{ font-weight:800; font-size:18px; margin-top:8px; text-shadow:0 1px 3px rgba(0,0,0,.25); }
  .terr .pg{ font-size:12px; opacity:.95; margin-top:3px; }
  .terr .cd{ display:inline-block; background:rgba(0,0,0,.28); border-radius:8px;
    padding:3px 8px; font-size:11.5px; font-weight:700; margin-top:7px; }
  .selo-novo{ background:#22c55e; color:#fff; font-size:10px; font-weight:800;
    padding:2px 6px; border-radius:6px; vertical-align:middle; letter-spacing:.4px; }
  .terr .cd.parc{ background:rgba(255,193,7,.22); color:#ffe082; margin-top:4px; }
  .aviso-cont{ background:rgba(255,193,7,.12); border:1px solid rgba(255,193,7,.38);
    color:#ffe9b0; border-radius:12px; padding:9px 12px; margin:8px 4px 2px;
    font-size:12.5px; line-height:1.45; }
  .terr .lock{ position:absolute; inset:0; background:rgba(20,16,50,.62);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-size:13px; font-weight:700; gap:4px; }
  .terr .lock .bg{ font-size:26px; }
  .terr .med{ position:absolute; top:8px; right:10px; font-size:22px; }
  .progress{ height:7px; background:rgba(0,0,0,.28); border-radius:5px; margin-top:8px; overflow:hidden; }
  .progress i{ display:block; height:100%; background:#fff; }

  /* ---- território: lista de missões ---- */
  .topbar{ display:flex; align-items:center; gap:8px; margin:6px 0 2px; }
  .voltar{ background:#241f52; color:#fff; border:1px solid #423a7e; border-radius:10px;
    padding:8px 12px; font-weight:700; font-size:14px; }
  .miss{ display:flex; align-items:center; gap:12px; }
  .miss .ic{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:24px; flex:0 0 auto; }
  .miss .tx{ flex:1; min-width:0; }
  .miss .tx .t{ font-weight:700; font-size:15.5px; }
  .miss .tx .s{ font-size:12.5px; color:#7d76a8; }
  .miss .go{ font-size:13px; font-weight:800; padding:8px 12px; border-radius:10px;
    color:#fff; }
  .selo{ font-size:20px; }
  .extras{ background:#241f52; border:1px dashed #4b4290; }
  .extras .ex{ display:flex; align-items:center; gap:10px; padding:8px 0; color:#cfc8f2; font-size:14px; }
  .extras .ex .em{ font-size:22px; }
  .embreve{ margin-left:auto; background:#3a3370; color:#cdb6ff; font-size:11px;
    font-weight:700; padding:3px 8px; border-radius:8px; }
  .exhead{ font-weight:700; color:#2a2350; font-size:15px; margin-bottom:8px; }
  .exhead .em{ font-size:20px; }
  .vid{ width:100%; border-radius:12px; background:#000; display:block; }

  /* ---- conteúdo da missão ---- */
  .box{ border-radius:12px; padding:11px 13px; margin:10px 0; font-size:14.5px; line-height:1.5; }
  .box.def{ background:#eef7f0; border-left:5px solid var(--ge); color:#234a30; }
  .box.dica{ background:#fff6e0; border-left:5px solid var(--ouro); color:#6a5200; }
  .box.ex{ background:#e9f2fc; border-left:5px solid var(--mt); color:#1d3c5e; }
  .conteudo p{ font-size:14.5px; line-height:1.55; margin:8px 2px; }
  .conteudo h3{ font-size:16px; margin:14px 2px 4px; }
  .conteudo ul{ margin:6px 0 6px 22px; font-size:14.5px; line-height:1.5; }
  .tab{ width:100%; border-collapse:collapse; margin:10px 0; font-size:13.5px; }
  .tab th,.tab td{ border:1px solid #ddd8f0; padding:6px 8px; text-align:left; }
  .tab th{ background:#f1eefb; }
  mark{ background:#fff1a8; padding:0 3px; border-radius:3px; }

  /* ---- quiz ---- */
  .qn{ font-weight:700; font-size:15.5px; margin:4px 2px 8px; }
  .qprog{ font-size:12px; color:#7d76a8; font-weight:700; }
  .opt{ display:block; width:100%; text-align:left; background:#f3f1fb; color:#2a2350;
    border:2px solid #e3def5; border-radius:12px; padding:12px; font-size:14.5px;
    margin:8px 0; }
  .opt.sel{ border-color:#7b4dff; background:#fff; }
  .opt.certa{ border-color:var(--ok); background:#e7f6ec; }
  .opt.errada{ border-color:var(--erro); background:#fbe9e8; }
  .feed{ font-size:13.5px; border-radius:10px; padding:10px; margin-top:6px; }
  .feed.bom{ background:#e7f6ec; color:#1d6b3a; }
  .feed.ruim{ background:#fbe9e8; color:#9a2a26; }
  .seqfogo{ background:linear-gradient(90deg,#fff3c4,#ffe0b3); color:#9a5b00;
    font-weight:800; font-size:13px; border-radius:10px; padding:8px 10px;
    margin-top:6px; text-align:center; animation:pop .4s ease; }

  /* ---- vida/movimento (transições de tela e micro-interações) ---- */
  @keyframes telain{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
  @keyframes cardin{ from{ opacity:0; transform:translateY(18px) scale(.96);} to{ opacity:1; transform:none;} }
  @keyframes facein{ from{ transform:scale(0) rotate(-12deg);} to{ transform:scale(1) rotate(0);} }
  @keyframes balaoin{ from{ opacity:0; transform:translateX(-8px);} to{ opacity:1; transform:none;} }
  @keyframes encher{ from{ width:0; } }
  @keyframes pulsar{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.04);} }
  #app.telain{ animation: telain .3s ease both; }
  #app.telain .terr{ animation: cardin .42s ease both; }
  #app.telain .terr:nth-child(1){ animation-delay:.03s } #app.telain .terr:nth-child(2){ animation-delay:.08s }
  #app.telain .terr:nth-child(3){ animation-delay:.13s } #app.telain .terr:nth-child(4){ animation-delay:.18s }
  #app.telain .terr:nth-child(5){ animation-delay:.23s } #app.telain .terr:nth-child(6){ animation-delay:.28s }
  #app.telain .terr:nth-child(7){ animation-delay:.33s } #app.telain .terr:nth-child(8){ animation-delay:.38s }
  #app.telain .aluno{ animation: cardin .3s ease both; }
  #app.telain .progress i{ animation: encher .8s ease both; }
  .cronos .face{ animation: facein .45s cubic-bezier(.34,1.56,.64,1) both; }
  .cronos .balao{ animation: balaoin .32s ease .1s both; }
  .feed.bom{ animation: pop .35s ease; }
  .feed.ruim{ animation: shake .4s ease; }
  .hoje button{ animation: pulsar 1.9s ease-in-out infinite; }
  .terr .med{ animation: pop .5s ease both; }
  .btn:active, .terr:active, .aluno:active, .opt:active{ transform:scale(.96); transition:transform .08s; }
  .confete{ position:fixed; inset:0; pointer-events:none; z-index:99; }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none!important; transition:none!important; } }

  /* ---- resultado ---- */
  .res{ text-align:center; }
  .res .big{ font-size:54px; }
  .res .nota{ font-size:30px; font-weight:800; margin:4px 0; }
  .res .xp{ display:inline-block; background:#fff3c4; color:#7a5b00; font-weight:800;
    padding:6px 14px; border-radius:12px; margin-top:4px; }
  @keyframes pop{ 0%{ transform:scale(.4); } 70%{ transform:scale(1.15);} 100%{ transform:scale(1);} }
  .pop{ display:inline-block; animation:pop .5s ease; }

  .rodape{ text-align:center; color:#6b6498; font-size:11px; margin-top:24px; }
  .rodape a{ color:#9a90d6; cursor:pointer; }

  /* ---- identificação (lista da turma) ---- */
  .pulsa{ animation:pulsa 1.1s ease-in-out infinite }
  @keyframes pulsa{ 0%,100%{opacity:.45;transform:scale(.9)} 50%{opacity:1;transform:scale(1.1)} }
  .alunos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:9px; margin-top:12px; }
  .aluno{ padding:12px 6px; border:2px solid #ffe08a; border-radius:14px;
    background:linear-gradient(180deg,#fffdf5,#fff4d6); color:#6a5410; font-weight:700;
    font-size:14px; box-shadow:0 3px 8px rgba(150,110,0,.1); }
  .aluno:active{ background:#fff; border-color:#ffb84d; }

  /* ---- welcome ---- */
  .welcome{ text-align:center; padding:16px; background:linear-gradient(135deg,#ffffff,#f3efff); }
  .welcome b{ color:#6a3fd0; }

  /* ---- ler-junto: linha sendo lida ---- */
  .conteudo .lnr{ padding:5px 9px; margin:2px 0; border-radius:9px;
    transition:background .2s ease, transform .2s ease; }
  .lnr.lendo{ background:linear-gradient(90deg,#fff1a8,#ffe27a); font-weight:700;
    box-shadow:0 2px 8px rgba(220,170,0,.25); transform:scale(1.012); }

  /* ---- resumão de referência ---- */
  .resumao{ background:#f5f3fc; border-radius:12px; padding:2px 12px; margin:10px 0; }
  .resumao summary{ cursor:pointer; font-weight:700; color:#5a4fae; padding:9px 0; font-size:14px; list-style:none; }
  .resumao summary::-webkit-details-marker{ display:none; }
  .resumao summary:before{ content:'▸ '; }
  .resumao[open] summary:before{ content:'▾ '; }
  .resumao-c{ font-size:13.5px; line-height:1.55; padding:0 0 10px; color:#3a3360; }

  /* ---- joguinho de classificar ---- */
  .jbins{ display:flex; gap:8px; margin-bottom:14px; }
  .jbin{ flex:1; padding:14px 6px; border-radius:14px; background:linear-gradient(180deg,#efeafd,#e2d9fb);
    color:#4a3f9e; font-weight:800; font-size:13px; border:2px solid #cdbff5; }
  .jbin:active{ background:#fff; }
  .jpool{ display:flex; flex-wrap:wrap; gap:8px; }
  .jitem{ padding:11px 13px; border-radius:12px; background:#f5f3fc; color:#2a2350;
    border:2px solid #e3def5; font-size:14px; font-weight:600; }
  .jitem.sel{ border-color:#7b4dff; background:#fff; box-shadow:0 0 0 3px rgba(123,77,255,.2); }
  .jitem.err{ border-color:var(--erro); background:#fbe9e8; animation:shake .3s; }
  .jitem.feito{ background:#e7f6ec; color:#1d6b3a; border:2px solid #b6e3c5; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  /* ---- ranking ---- */
  .rkrow{ display:flex; align-items:center; gap:12px; padding:11px 8px; border-bottom:1px solid #eee; }
  .rkfb{ background:linear-gradient(135deg,#fff6da,#ffe7a8); color:#7a5b00; border-radius:14px;
    padding:11px 13px; font-weight:700; font-size:14px; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   StepQuest — app de estudos da Mariana (3ª Avaliação, 21 a 25/09/2026)
   Arquitetura: MOTOR (genérico) + CONTEÚDO (dados por matéria).
   Para adicionar uma matéria, basta preencher CONTEUDO[id].
   ============================================================ */

/* ---------- datas das provas (3ª Avaliação — 21 a 25/set/2026) ---------- */
const PROVAS = {
  "portugues": "2026-09-21",
  "matematica": "2026-09-22",
  "artes": "2026-09-23",
  "geografia": "2026-09-23",
  "ciencias": "2026-09-24",
  "edfisica": "2026-09-25",
  "ingles": "2026-09-23"
};

/* ---------- territórios (matérias) ---------- */
const TERRITORIOS = [
  {
    "id": "portugues",
    "nome": "Português",
    "emoji": "📜",
    "cor": "#E91E63"
  },
  {
    "id": "matematica",
    "nome": "Matemática",
    "emoji": "🔢",
    "cor": "#2196F3"
  },
  {
    "id": "artes",
    "nome": "Artes",
    "emoji": "🎨",
    "cor": "#FF7043"
  },
  {
    "id": "geografia",
    "nome": "Geografia",
    "emoji": "🗺️",
    "cor": "#4CAF50"
  },
  {
    "id": "ciencias",
    "nome": "Ciências",
    "emoji": "🔬",
    "cor": "#9C27B0"
  },
  {
    "id": "edfisica",
    "nome": "Ed. Física",
    "emoji": "🏅",
    "cor": "#795548"
  },
  {
    "id": "ingles",
    "nome": "Inglês",
    "emoji": "🇺🇸",
    "cor": "#00897B"
  }
];

const PERSONAGENS = [
  { id:'explor', emoji:'🧭', nome:'Explorador(a)' },
  { id:'cient',  emoji:'🔭', nome:'Cientista' },
  { id:'paleo',  emoji:'🦕', nome:'Caça-Dinos' },
  { id:'tempo',  emoji:'⚡', nome:'Viajante' },
];

/* ---------- CONTEÚDO (transposto do Roblox — não editar à mão) ---------- */
const CONTEUDO = {
  "portugues": {
    "missoes": [
      {
        "id": "pt-verbos-tempos",
        "emoji": "⏳",
        "titulo": "Presente, passado e futuro",

        "resumo": "Os verbos se <b>flexionam</b> em três tempos:<br><br>🕐 <b>PRESENTE</b> — indica o que acontece <b>no momento em que se fala</b>, ou situações que se repetem.<br><i>André dorme cedo durante a semana.</i><br><br>🕗 <b>PASSADO (ou PRETÉRITO)</b> — indica o que aconteceu <b>antes</b> do momento em que se fala.<br><i>Taciana acordou tarde.</i><br><br>🕔 <b>FUTURO</b> — indica o que vai acontecer <b>depois</b> do momento em que se fala.<br><i>Elias viajará na próxima semana.</i><br><br>✍️ <b>A ARMADILHA DA ESCRITA</b>: no plural, <b>-RAM</b> é passado (eles <i>pescaram</i> ontem) e <b>-RÃO</b> é futuro (eles <i>pescarão</i> amanhã). É a mesma dupla que a Dona Letra já te mostrou no ditado.<br><br>📗 <b>AS TRÊS CONJUGAÇÕES</b> (pelo fim do verbo no infinitivo):<br>• <b>1ª</b> — terminados em <b>-AR</b>: cantar, gorjear, caminhar<br>• <b>2ª</b> — terminados em <b>-ER</b>: ter, trazer, comer<br>• <b>3ª</b> — terminados em <b>-IR</b>: partir, dormir<br>👉 No trecho da <i>Canção do Exílio</i> que está na apostila, quase todos os verbos são da 1ª conjugação (cantar, gorjear); o único da <b>2ª</b> é <b>ter</b> (<i>tem, têm</i>).",

     narracao/_quiz/_int; quando os MP3 novos forem gerados, basta rodar o injetor de
     novo e o pool cresce sozinho. */
  var t=(typeof INTERJ_TXT!=='undefined')&&INTERJ_TXT;
  return (t&&t[mat]&&t[mat][k])?t[mat][k].length:NVAR[k];
}
function sorteiaInterj(mat,k){

  return rvar(nInterj(mat,k));
}

/* ============================================================================
   IDENTIDADE DO ALUNO — a mesma criança em qualquer aparelho (06/09/2026)
   ============================================================================
   O problema: `estado.id` é um uuid gerado por APARELHO. A Mariana entrava no
   celular dela e depois no do pai, e nascia uma linha nova no placar a cada vez
   — no dia desta mudança ela ocupava 4 das 16 linhas (475, 400, 0 e 1025 XP).
   Pior: `melhores` (o que cada um já acertou) vivia SÓ no localStorage, então
   trocar de aparelho começava do zero.

   O desenho:
   • `estado.id`  continua sendo o uuid DO APARELHO e continua sendo o único
     identificador que vai para o tutor — o tutor nunca recebe nome, e isso não
     pode mudar (são 25 crianças de outras famílias).
   • `idAluno()`  é a identidade no PLACAR: 'aluno:<slug do nome>'. O nome já é
     público na tabela `ranking`, então nada se expõe a mais.
   • o progresso agora sobe junto (coluna `progresso`), e a fusão fica com a
     MAIOR nota de cada missão. Fundir por máximo nunca apaga nada: entrar num
     aparelho novo só pode aumentar o que você tem.
   • `piso` guarda os pontos herdados das linhas antigas, de aparelhos que podem
     nunca mais ser abertos. O total exibido é o maior entre o piso e o XP real,
     para ninguém ver o placar DESPENCAR na migração.

   Regra que vale mais que tudo isto: NADA AQUI PODE TRAVAR O APP. Toda chamada
   de rede está em try/catch e todo caminho de erro termina no comportamento
   antigo — joga-se offline, e os pontos sobem depois (`syncPend`).

   ⚠️ Sem senha, por decisão do Heitor (06/09): quem tocar em "Mariana" carrega
   o progresso da Mariana. A trava por PIN chegou a ser desenhada e não foi
   ligada; se a turma abusar, é aqui que ela entra. */

/* Slug do nome INTEIRO. Não dá para usar slugNome(), que só pega o primeiro
   nome: "Alice D.", "Alice M." e "Alice P." virariam a mesma aluna — e o mesmo
   valeria para os dois Joões e os dois Pedros da turma. */
function slugAluno(n){
  return String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
         .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

   celular com a página VELHA em cache regravava o XP antigo na linha da criança, e o app
   novo o puxava de volta na abertura seguinte. Com a temporada no id, o app novo só lê e
   grava `<temporada>:<aluno>`; as linhas das temporadas passadas ficam no banco como
   arquivo, e página velha escreve nas dela sem contaminar ninguém. Virou de prova?
   Troque TEMPORADA e CHAVE juntas. (O trigger ranking_uma_linha deixa passar qualquer
   id com prefixo `xxx:` e só redireciona o uuid de aparelho das páginas pré-06/09.) */
const TEMPORADA = 'av3';
function idAluno(){
  return (estado.perfil && estado.perfil.nome) ? TEMPORADA+':'+slugAluno(estado.perfil.nome) : null;
}
/* Fica a MAIOR nota de cada missão. Chave que só existe de um lado é mantida. */
function fundirMelhores(a, b){
  var r = {}, k;
  for(k in (a||{})) r[k] = a[k];
  for(k in (b||{})) if(!(k in r) || b[k] > r[k]) r[k] = b[k];
  return r;
}
var CAB_SUPA = { 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY,
                 'Content-Type':'application/json' };

/* Lê a linha do aluno. Se as colunas novas ainda não existirem no banco, cai
   sozinho na leitura antiga em vez de devolver erro — o placar continua de pé. */
async function baixarAluno(){
  var id = idAluno(); if(!id) return null;
  var base = SUPA_URL+'/rest/v1/ranking?id=eq.'+encodeURIComponent(id)+'&select=';
  for(var i=0; i<2; i++){
    try{
      var r = await fetch(base + (i===0 ? 'id,nome,pontos,progresso,piso' : 'id,nome,pontos'),
                          { headers:{ 'apikey':SUPA_KEY } });
      if(!r.ok) continue;
      var l = await r.json();
      return (l && l.length) ? l[0] : null;
    }catch(e){ /* sem rede: tenta a próxima forma e depois desiste */ }
  }
  return null;
}

/* Traz o que esta criança fez em QUALQUER aparelho e funde no progresso local.
   Devolve true se algo mudou na tela. Nunca lança, nunca apaga, nunca bloqueia. */
async function fundirComServidor(){
  var linha = await baixarAluno();
  if(!linha) return false;
  var antes = JSON.stringify(estado.melhores) + '|' + (estado.piso||0);
  estado.melhores = fundirMelhores(estado.melhores, linha.progresso || {});
  /* O piso é o XP HERDADO das linhas por aparelho, e tem de ficar parado nesse
     valor: ele só existe para o placar não despencar na migração, e some sozinho
     quando o progresso real o supera. Isto aqui era `max(linha.piso, linha.pontos)`
     e fazia o piso subir junto com a pontuação — virava marca histórica permanente,
     e na próxima virada de prova seguraria XP de missão que nem existe mais (o
     mesmo XP inalcançável de 30/08). `linha.pontos` só entra quando a linha vem
     SEM a coluna piso, que é a leitura degradada do banco antigo. */
  var herdado = (typeof linha.piso === 'number') ? linha.piso : (linha.pontos||0);
  if(herdado > (estado.piso||0)) estado.piso = herdado;
  sanearMelhores();
  var depois = JSON.stringify(estado.melhores) + '|' + (estado.piso||0);
  if(antes !== depois){ salvar(); return true; }
  return false;
}

/* ---- ranking da turma (Supabase) — nunca perde ponto: marca pendência e re-tenta ---- */
async function enviarRanking(){
  var id = idAluno(); if(!id) return false;
  var ok = false;
  try{
    // 1. junta o que outro aparelho gravou nesse meio tempo, para não sobrescrever
    await fundirComServidor();
    // 2. grava o resultado da fusão
    var linha = { id:id, nome:estado.perfil.nome, pontos:totalXP(),
                  progresso:estado.melhores, piso:(estado.piso||0),
                  atualizado:new Date().toISOString() };
    ok = await gravarLinha(id, linha);
    if(!ok){
      // banco ainda sem as colunas novas: grava o essencial, como antes de hoje
      delete linha.progresso; delete linha.piso;
      ok = await gravarLinha(id, linha);
    }
  }catch(e){ ok = false; }
  if(estado.syncPend !== !ok){ estado.syncPend = !ok; salvar(); }
  return ok;
}
async function gravarLinha(id, linha){
  try{
    var r = await fetch(SUPA_URL+'/rest/v1/ranking?on_conflict=id', {
      method:'POST',
      headers:Object.assign({ 'Prefer':'resolution=merge-duplicates' }, CAB_SUPA),
      body: JSON.stringify([linha])
    });
    if(r.ok) return true;
    // upsert recusado (ex.: política de UPDATE) — tenta atualizar a linha direto
    var corpo = {}; for(var k in linha) if(k!=='id') corpo[k] = linha[k];
    var p = await fetch(SUPA_URL+'/rest/v1/ranking?id=eq.'+encodeURIComponent(id), {
      method:'PATCH', headers:CAB_SUPA, body: JSON.stringify(corpo)
    });
    return p.ok;
  }catch(e){ return false; }
}
async function carregarRanking(){
  try{
    const r = await fetch(SUPA_URL+'/rest/v1/ranking?select=id,nome,pontos&id=like.'+TEMPORADA+'%3A*&order=pontos.desc,atualizado.asc&limit=50',
      { headers:{ 'apikey':SUPA_KEY } });
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}
/* Uma criança, uma linha. As linhas por aparelho de antes de 06/09 foram
   consolidadas no banco, mas um celular com a página velha em cache ainda pode
   criar uma — então a tela também agrupa por nome e mostra a maior pontuação.
   Defesa em profundidade: o placar nunca volta a exibir 4 Marianas. */
function agruparPorNome(lista){
  var por = {}, ordem = [];
  (lista||[]).forEach(function(r){
    var k = slugAluno(r.nome);
    if(!por[k]){ por[k] = { id:r.id, nome:r.nome, pontos:r.pontos }; ordem.push(k); }
    else if(r.pontos > por[k].pontos){ por[k].pontos = r.pontos; por[k].id = r.id; }
  });
  return ordem.map(function(k){ return por[k]; })
              .sort(function(a,b){ return b.pontos - a.pontos; });
}

/* ---- progressão ---- */
/* limpa chaves órfãs (conteúdo que mudou) e teta cada nota no máximo da
   missão atual — garante que o XP nunca passa do possível */
function sanearMelhores(){
  var lim = {};
  for(var tid in CONTEUDO){
    CONTEUDO[tid].missoes.forEach(function(ms){ lim[ms.id]=(ms.quiz||[]).length; });
  }
  /* Os bônus existem para MAIS matérias do que os deveres: CONTEUDO tem 5
     (português, matemática, história, geografia, ciências), mas PROVAFINAL e JOGOS
     têm 8 — as 5 mais artes, ed. física e inglês — e há podcast para as 8.
     Montar `lim` dentro do laço de CONTEUDO deixava prova-/jogo-/pod- dessas três
     matérias FORA da lista de chaves válidas, e o passo seguinte as apagava como
     órfãs. Como sanearMelhores() roda a cada abertura do app e salva, eram 675 XP
     (3 x 225) que a criança ganhava e o app apagava — refazer não adiantava, o
     máximo era inalcançável. Por isso o universo de matérias é a UNIÃO das três
     fontes, nunca só a dos deveres. */
  var materias = {};
  for(var a in CONTEUDO) materias[a]=1;
  if(typeof PROVAFINAL!=='undefined') for(var b in PROVAFINAL) materias[b]=1;
  if(typeof JOGOS!=='undefined')      for(var c in JOGOS)      materias[c]=1;
  for(var mid in materias){
    if(typeof PROVAFINAL!=='undefined' && PROVAFINAL[mid]) lim['prova-'+mid]=4;
    if(typeof JOGOS!=='undefined' && JOGOS[mid]) lim['jogo-'+mid]=3;
    lim['pod-'+mid]=2;
    lim['ativ-'+mid]=4;   // atividade extra
  }
  /* ATIVIDADES chaves vivas: uma matéria pode ter várias atividades, e cada
     uma guarda a nota na própria chave. */
  if(typeof ATIVIDADES!=='undefined') for(var _am in ATIVIDADES){
    var _al = ATIVIDADES[_am].lista || [ATIVIDADES[_am]];
    for(var _ai=0;_ai<_al.length;_ai++) lim[_al[_ai].chave || ('ativ-'+_am)] = 4;
  }
  var mudou=false;
  for(var k in estado.melhores){
    if(lim[k]==null){ delete estado.melhores[k]; mudou=true; }
    else if(estado.melhores[k]>lim[k]){ estado.melhores[k]=lim[k]; mudou=true; }
  }
  if(mudou) salvar();
}
function xpDoProgresso(){ let x=0; for(const k in estado.melhores) x += estado.melhores[k]*25; return x; }
/* `piso` são os pontos que a criança já tinha em aparelhos de antes da
   unificação (06/09/2026) e cujo detalhe por missão ninguém guardou — o placar
   antigo só gravava o total. Enquanto o progresso fundido não passa desse
   número, ele é que vale: a alternativa seria a criança abrir o app e ver a
   pontuação despencar. Assim que ela supera o piso, ele deixa de contar. */
function totalXP(){ return Math.max(xpDoProgresso(), estado.piso||0); }
function nivel(){ return Math.floor(totalXP()/100)+1; }
function xpNoNivel(){ return totalXP()%100; }
function missoesDe(id){ return CONTEUDO[id] ? CONTEUDO[id].missoes : []; }
function feita(mid){ return estado.melhores[mid]!=null; }
function territorioCompleto(id){
  const ms = missoesDe(id); return ms.length>0 && ms.every(m=>feita(m.id));
}
function territorioOuro(id){
  const ms = missoesDe(id); return ms.length>0 && ms.every(m=>estado.melhores[m.id]===4);
}

/* ---- streak ---- */
function diaAnterior(iso){
  const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function registrarDia(){
  if(estado.ultimoDia===HOJE) return;
  if(estado.ultimoDia===diaAnterior(HOJE)) estado.streak++;
  else estado.streak = 1;
  estado.ultimoDia = HOJE;
}

/* ---- contagem regressiva ---- */
/* Derivado de PROVAS, e de propósito FORA do bloco que o gerar_webapp.py substitui
   (ele troca tudo entre "datas das provas" e "const MIDIA = {}"). Em 30/08/2026 isto
   era uma const dentro daquele bloco: sobreviveu no motor e SUMIU no app gerado, que
   quebrou no iPhone com "Can't find variable: PRIMEIRA_PROVA" assim que o fraseMapa()
   rodava. Derivar em vez de repetir faz o valor existir nos dois arquivos sempre — e
   acompanha sozinho qualquer mudança no cronograma. */
const PRIMEIRA_PROVA = Object.values(PROVAS).filter(Boolean).sort()[0];
/* ---- conteúdo que ainda não chegou ---- */
/* A escola libera apostila por semana, e a última costuma sair em cima da prova. Sem
   dizer isso, o app se apresenta como se cobrisse tudo — e uma criança que estudou só
   por ele chega na prova achando que viu a matéria inteira. Editar `parciais` quando a
   apostila entrar: tirar a matéria da lista é o que apaga o selo. Fica FORA do bloco que
   o aplicar_conteudo.py substitui, pela mesma razão do PRIMEIRA_PROVA acima. */
const AVISO_CONTEUDO = {

  "parciais": [

  ],

    },

};
function avisoConteudo(){
  if(!AVISO_CONTEUDO || !AVISO_CONTEUDO.texto) return '';
  /* 18/09/2026, pedido do Heitor: "deixe registrado o que ainda não está na apostila, só
     pra os pais saberem das lacunas". A lista vem de AVISO_CONTEUDO.lacunas (arquivo de
     estruturas da prova): quando a apostila chega e o item sai de lá, ele some daqui. */

         + '<ul style="margin:3px 0 0 18px;padding:0">'+(x.faltam||[]).map(function(f){return '<li>'+f+'</li>';}).join('')+'</ul>'
         + (x.obs?'<div style="font-size:12px;opacity:.8;margin-top:2px">'+x.obs+'</div>':'')+'</div>';

/* a mesma lacuna, dentro da matéria */
function avisoMateria(nome){

  if(!x) return '';

       + '<ul style="margin:4px 0 0 18px;padding:0">'+(x.faltam||[]).map(function(f){return '<li>'+f+'</li>';}).join('')+'</ul></div>';
}
function parcial(id){
  return !!(AVISO_CONTEUDO && (AVISO_CONTEUDO.parciais||[]).indexOf(id) >= 0);
}
function diasAte(iso){
  const a=new Date(HOJE+'T12:00:00'), b=new Date(iso+'T12:00:00');
  return Math.round((b-a)/86400000);
}
function textoContagem(id){
  /* Nem toda matéria cai no simulado — no 3º (08 a 11/09) Artes e Ed. Física ficam de
     fora. Antes o gerador dava uma data a todas e o card anunciava "prova em X dias"
     para matéria que não tem prova. PROVAS[id] nulo = território de exploração. */
  if(!PROVAS[id]) return '✨ não cai na avaliação';
  const d = diasAte(PROVAS[id]);
  if(d<0) return 'prova já passou';
  if(d===0) return '📣 prova é HOJE!';
  if(d===1) return '📣 prova é AMANHÃ!';
  return '🗓️ prova em '+d+' dias';
}

/* ---- missão do dia ---- */
function missaoDoDia(){
  for(const t of TERRITORIOS){
    for(const m of missoesDe(t.id)){
      if(!feita(m.id)) return {terr:t, miss:m, revisao:false};
    }
  }
  for(const t of TERRITORIOS){
    const ms = missoesDe(t.id);
    if(ms.length){ return {terr:t, miss:ms[0], revisao:true}; }
  }
  return null;
}

const app = document.getElementById('app');
let _ultimaTela=null;
function render(){
  const telaAtual = !estado.perfil ? 'abertura' : view.tela;
  const trocou = telaAtual!==_ultimaTela; _ultimaTela=telaAtual;
  /* Nome fora da lista da turma = perfil criado pelo antigo "Outro" (ou editado à mão
     no localStorage). Volta para a identificação em vez de seguir jogando: sem isto,
     quem já burlou continuaria no ranking com nome inventado para sempre. O progresso
     em estado.melhores não é apagado — só a identidade é refeita. */
  if(estado.perfil && !nomeDaTurma(estado.perfil.nome)){ estado.perfil = null; salvar(); }
  if(!estado.perfil){ telaAbertura(); }
  else if(view.tela==='mapa') telaMapa();
  else if(view.tela==='territorio') telaTerritorio();
  else if(view.tela==='missao') telaMissao();
  else if(view.tela==='atividade') telaAtividade();

  else if(view.tela==='jogo') telaJogo();

  // anima só na TROCA de tela (não a cada clique dentro da mesma tela)
  if(trocou){ app.classList.remove('telain'); void app.offsetWidth; app.classList.add('telain'); }
  window.scrollTo(0,0);
}

/* ---- festa: confete leve em canvas (recorde, 100%, prova, joguinho) ---- */
function confete(qtd){
  try{
    var cv=document.createElement('canvas'); cv.className='confete';
    cv.width=window.innerWidth; cv.height=window.innerHeight;
    document.body.appendChild(cv);
    var cx=cv.getContext('2d');
    var cores=['#FFC857','#FF6B6B','#4ECDC4','#9B5DE5','#43AA8B','#F94892','#3A86FF'];
    var pcs=[]; for(var i=0;i<(qtd||90);i++) pcs.push({
      x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.4,
      r:4+Math.random()*5, c:cores[(Math.random()*cores.length)|0],
      v:2.2+Math.random()*3, a:Math.random()*Math.PI, va:(Math.random()-.5)*.25 });
    var t0=null;
    (function passo(ts){
      if(t0===null && ts!==undefined) t0=ts;
      cx.clearRect(0,0,cv.width,cv.height);
      pcs.forEach(function(p){ p.y+=p.v; p.x+=Math.sin((p.y+p.a*60)/28)*1.6; p.a+=p.va;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a);
        cx.fillStyle=p.c; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); });
      if(ts===undefined || ts-t0<2400) requestAnimationFrame(passo); else cv.remove();
    })();
  }catch(e){}
}
/* número que sobe rolando (XP no resultado) */
function animarNumero(id, alvo, ms){
  var el=document.getElementById(id); if(!el) return;
  var t0=null;
  (function p(ts){ if(t0===null && ts!==undefined) t0=ts;
    var k = ts===undefined ? 0 : Math.min(1,(ts-t0)/(ms||700));
    el.textContent = Math.round(alvo*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(p);
  })();
}

const ALUNOS = ["Alice D.","Alice M.","Alice P.","Bernardo","Betina","Cadu","Clara",

function slugNome(n){ return (n||'').split(' ')[0].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,''); }
let audioNome=null;
function ouvirNome(){

function entrar(nome){

     está jogando; o progresso antigo aparece sozinho alguns segundos depois. */
  sincronizarAluno();
}
/* Puxa e devolve o progresso do aluno, sem nunca bloquear a tela nem lançar. */
function sincronizarAluno(){
  try{
    return fundirComServidor().then(function(mudou){
      if(mudou) render();
      return enviarRanking();
    }).catch(function(){ return false; });
  }catch(e){ return Promise.resolve(false); }
}
/* O botão "✏️ Outro" abria um prompt de texto livre: bastava trocar o nome para
   nascer uma linha nova no ranking, e a turma descobriu isso — viravam vários
   jogadores. Removido em 30/08/2026 a pedido do Heitor. A identificação agora é
   fechada na lista da turma. */

/* ============================================================================
   MOTOR DE ATIVIDADES — StepQuest, 30/08/2026
   Injetado no app por scripts/injetar_atividades.py. Não editar dentro do HTML.

   Sai do formato "pergunta + 4 opções" e acrescenta quatro dinâmicas:
     malha    — clicar nos quadradinhos para contar a área (Matemática)
     escrita  — a criança DIGITA a resposta (ditado, resposta curta)
     ordenar  — colocar etapas na sequência certa
     memoria  — jogo da memória de pares

   A peça mais importante daqui não é nenhuma tela: é o conferirTexto(). Uma
   criança de 9 anos escreve "eh a pessoa que conta a vida dela mesma" e isso
   está CERTO. Corretor rígido transforma acerto em erro e ensina a odiar o app.
   Ver as regras logo abaixo.

   O tempo NÃO conta em lugar nenhum: a pedido do Heitor (30/08), velocidade não
   é o que a prova mede, e cronômetro ensinaria a otimizar a coisa errada.
   ========================================================================== */

/* ---------- 1. Entender o que a criança escreveu ---------- */

/* Tira tudo o que não muda o sentido: acento, maiúscula, pontuação, espaço
   repetido. "É a Autobiografia!" e "eh autobiografia" viram a mesma coisa. */
function normTxt(t) {
  return String(t || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[.,;:!?"'()\[\]]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/* Distância de edição, para perdoar erro de digitação e troca de letra.
   Limitada a palavras: comparar frases inteiras assim daria falso positivo. */
function distEdicao(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length;
  if (!m || !n) return Math.max(m, n);
  var linha = Array.from({ length: n + 1 }, function (_, i) { return i; });
  for (var i = 1; i <= m; i++) {
    var ant = linha[0]; linha[0] = i;
    for (var j = 1; j <= n; j++) {
      var tmp = linha[j];
      linha[j] = Math.min(linha[j] + 1, linha[j - 1] + 1,
                          ant + (a[i - 1] === b[j - 1] ? 0 : 1));
      ant = tmp;
    }
  }
  return linha[n];
}

/* Quanto de erro de digitação uma palavra aguenta. Palavra curta não pode
   perdoar quase nada: em "mas" e "mais" um caractere JÁ É a resposta certa —
   perdoar aí destruiria o exercício de ortografia. */
function folga(palavra) {
  var n = palavra.length;
  if (n <= 4) return 0;
  if (n <= 7) return 1;
  return 2;
}

function pareceCom(escrito, alvo) {
  if (escrito === alvo) return true;
  return distEdicao(escrito, alvo) <= folga(alvo);
}

/* A criança escreveu alguma forma desta ideia? `formas` é a lista de jeitos
   aceitos de dizer a mesma coisa — é aqui que a flexibilidade mora, e é por
   isso que cada ideia no conteúdo traz várias formas. */
function contemIdeia(texto, formas) {
  var t = normTxt(texto), palavras = t.split(' ');
  for (var i = 0; i < formas.length; i++) {
    var alvo = normTxt(formas[i]);
    if (!alvo) continue;
    if (alvo.indexOf(' ') >= 0) {          // expressão: procura literal
      if (t.indexOf(alvo) >= 0) return true;
      continue;
    }
    for (var j = 0; j < palavras.length; j++) {
      if (pareceCom(palavras[j], alvo)) return true;
    }
  }
  return false;
}

/* Confere uma resposta escrita.
   item.certas  — respostas aceitas por inteiro (ditado, palavra que falta)
   item.ideias  — [{nome, formas:[...]}] para resposta curta: conta quantas
                  ideias-chave apareceram, em vez de exigir uma frase exata.
   Devolve {ok, acertou:[...], faltou:[...], vazio}. Quem decide o que fazer
   com isso é a tela — aqui não se julga, só se lê. */
function conferirTexto(resposta, item) {
  var t = normTxt(resposta);
  if (!t) return { ok: false, vazio: true, acertou: [], faltou: [] };

  if (item.certas && item.certas.length) {
    /* PALAVRAS CRÍTICAS são as que o exercício está testando — em "Tia Márcia saiu,
       ___ volta logo" a palavra é "mas". Elas têm de aparecer IDÊNTICAS, sem folga
       de digitação nenhuma.
       Sem isto o ditado se autodestruía: trocar "mas" por "mais" custa um caractere
       na frase inteira, a tolerância global perdoava, e o app dava como certo
       exatamente o erro que a prova vai cobrar. */
    var palavras = t.split(' ');
    var criticas = (item.criticas || []).map(normTxt);
    for (var c = 0; c < criticas.length; c++) {
      if (palavras.indexOf(criticas[c]) < 0) {
        return { ok: false, acertou: [], faltou: [], critica: criticas[c] };
      }
    }
    for (var i = 0; i < item.certas.length; i++) {
      var alvo = normTxt(item.certas[i]);
      if (t === alvo) return { ok: true, acertou: [], faltou: [] };
      /* NÚMERO não tem folga de digitação (18/09/2026). A tolerância existe para perdoar
         "tranlação"; aplicada a "124 25" ela aceitava 123,25, 124,15 e até 2,4 no lugar
         de 2,6 — dava como certa exatamente a conta errada. Se a resposta esperada tem
         algarismo, os algarismos da criança têm de ser os mesmos, na mesma ordem; a
         folga continua valendo só para as letras em volta ("2,6 metrs"). */
      if (/\d/.test(alvo) &&
          (t.match(/\d+/g) || []).join(' ') !== (alvo.match(/\d+/g) || []).join(' ')) continue;
      // uma palavra só: aceita a frase inteira se ela contiver a palavra certa
      if (alvo.indexOf(' ') < 0 && contemIdeia(t, [alvo])) {
        return { ok: true, acertou: [], faltou: [] };
      }
      if (alvo.indexOf(' ') >= 0 && distEdicao(t, alvo) <= 2) {
        return { ok: true, acertou: [], faltou: [] };
      }
    }
    return { ok: false, acertou: [], faltou: [] };
  }

  var acertou = [], faltou = [];
  (item.ideias || []).forEach(function (ideia) {
    (contemIdeia(t, ideia.formas) ? acertou : faltou).push(ideia);
  });
  var minimo = item.minimo || Math.ceil((item.ideias || []).length / 2);
  return { ok: acertou.length >= minimo, acertou: acertou, faltou: faltou };
}

/* ---------- 2. Estado de uma atividade ---------- */
var ativ = null;

/* Uma matéria pode ter VÁRIAS atividades extras — é isso que permite acrescentar
   uma por semana sem trocar a anterior. `ATIVIDADES[mat]` aceita as duas formas:
   o objeto solto de antes, ou { lista: [...] }. */
function ativsDe(mat) {
  var a = (typeof ATIVIDADES !== 'undefined') && ATIVIDADES[mat];
  if (!a) return [];
  return a.lista ? a.lista : [a];
}

/* A chave do XP vem escrita no conteúdo, nunca deduzida da posição na lista.
   Deduzir custaria caro: as crianças já têm `ativ-<materia>` salvo, e uma chave
   nova é chave órfã — sanearMelhores apagaria o XP delas na abertura seguinte,
   que foi exatamente o bug dos 675 XP. Atividade antiga mantém a chave antiga. */
function chaveAtiv(mat, at) { return (at && at.chave) || ('ativ-' + mat); }
function ativAtual() { return ativsDe(ativ.mat)[ativ.idx] || ativsDe(ativ.mat)[0]; }

function iniciarAtividade(mat, idx) {
  resetTutor();
  /* Zera o contador de entradas automáticas do professor. Ele é por PERGUNTA, mas
     vivia enquanto a página estivesse aberta: quem refizesse a atividade — que é o
     que o app pede, para bater o recorde — chegava na terceira rodada sem tutor
     nenhum, e sem nada na tela explicando. O cache de respostas fica, porque
     reaproveitar o que já foi dito não custa chamada. */
  tutorChamadas = {};
  var lista = ativsDe(mat), a = lista[idx || 0];
  if (!a) return;
  ativ = { mat: mat, idx: idx || 0, tipo: a.tipo, i: 0, acertos: 0, resp: {},
           conferido: false, tentativas: 0, dados: null };
  if (a.tipo === 'memoria') prepararMemoria(a);
  if (a.tipo === 'ordenar') prepararOrdenar(a);
  if (a.tipo === 'malha') prepararMalha(a);
  if (a.tipo === 'fracao') prepararFracao(a);
  if (a.tipo === 'reta') prepararReta(a);
  view = { tela: 'atividade', terr: mat };
  render();
}

/* Guarda o resultado. Como nas missões, só SOBE: refazer melhor conta, refazer
   pior não apaga o que já foi conquistado. */
function fecharAtividade() {
  var total = totalPassosAtiv();
  var nota = Math.round((ativ.acertos / total) * 4);
  var k = chaveAtiv(ativ.mat, ativAtual());
  if (!(estado.melhores[k] >= nota)) { estado.melhores[k] = nota; }
  salvar(); enviarRanking();
  ativ.fim = true; render();
}

function totalPassosAtiv() {
  var a = ativAtual();
  if (a.tipo === 'memoria') return (a.pares || []).length;
  if (a.tipo === 'ordenar') return 1;
  if (a.tipo === 'malha') return (a.figuras || []).length;
  if (a.tipo === 'fracao') return (a.rodas || []).length;
  if (a.tipo === 'reta') return (a.itens || []).length;
  return (a.itens || []).length;
}

/* ---------- 3. Malha viva ---------- */
/* A criança CLICA nos quadradinhos e o app conta junto. É o gesto que a prova
   pede — bem mais perto do que a apostila ensina do que escolher entre quatro
   alternativas. */
function prepararMalha(a) {
  ativ.dados = { marcados: {}, fig: 0 };
}

function malhaFig() { return ativAtual().figuras[ativ.dados.fig]; }

function togglecel(idx) {
  if (ativ.conferido) return;
  var m = ativ.dados.marcados;
  if (m[idx]) delete m[idx]; else m[idx] = 1;
  render();
}

function conferirMalha() {
  var f = malhaFig();
  var marcados = Object.keys(ativ.dados.marcados).map(Number).sort(function (x, y) { return x - y; });
  var certos = f.celulas.slice().sort(function (x, y) { return x - y; });
  var iguais = marcados.length === certos.length &&
               marcados.every(function (v, i) { return v === certos[i]; });
  ativ.conferido = true;
  ativ.ultimo = {
    iguais: iguais,
    contou: marcados.length,
    esperado: certos.length,
    area: certos.length * (f.valor || 1),
    sobrando: marcados.filter(function (v) { return certos.indexOf(v) < 0; }).length,
    faltando: certos.filter(function (v) { return marcados.indexOf(v) < 0; }).length
  };
  if (iguais) ativ.acertos++;
  render();
}

function proximaMalha() {
  var a = ativAtual();
  if (ativ.dados.fig + 1 >= a.figuras.length) return fecharAtividade();
  ativ.dados.fig++; ativ.dados.marcados = {}; ativ.conferido = false; ativ.ultimo = null;
  render();
}

/* ---------- 3b. Roda de frações ---------- */
/* A criança PINTA a fração numa roda dividida em fatias, em vez de escolher entre
   quatro alternativas. Cai no simulado como "frações unitárias" — as de numerador 1
   —, e a pegadinha que a prova cobra é justamente visual: 1/8 tem o número maior
   embaixo e é o pedaço MENOR. Isso se vê; não se decora.

   Duas dinâmicas: `pintar` (pinte 3/8) e `comparar` (duas rodas prontas, qual pedaço
   é maior). O desenho é SVG inline — nada de imagem externa, porque o app roda do
   GitHub Pages e o CSP do visualizador bloqueia mídia de fora. */
function prepararFracao(a) {
  ativ.dados = { roda: 0, pintadas: {}, escolha: null };
}
function rodaAtual() { return ativAtual().rodas[ativ.dados.roda]; }

function toggleFatia(i) {
  if (ativ.conferido) return;
  var m = ativ.dados.pintadas;
  if (m[i]) delete m[i]; else m[i] = 1;
  render();
}
function escolherRoda(i) {
  if (ativ.conferido) return;
  ativ.dados.escolha = i;
  render();
}

function conferirFracao() {
  var r = rodaAtual(), ok;
  if (r.modo === 'comparar') {
    ok = ativ.dados.escolha === r.certa;
    ativ.ultimo = { iguais: ok, comparar: true };
  } else {
    var n = Object.keys(ativ.dados.pintadas).length;
    ok = n === r.pedir;
    ativ.ultimo = { iguais: ok, contou: n, esperado: r.pedir, fatias: r.fatias };
  }
  ativ.conferido = true;
  if (ok) ativ.acertos++;
  render();
}

function proximaRoda() {
  var a = ativAtual();
  if (ativ.dados.roda + 1 >= a.rodas.length) return fecharAtividade();
  ativ.dados.roda++;
  ativ.dados.pintadas = {}; ativ.dados.escolha = null;
  ativ.conferido = false; ativ.ultimo = null;
  render();
}

/* desenha uma roda (ou barra) de N fatias; `pint` diz quais estão pintadas */
function svgFracao(fatias, pint, tam, cor, clicavel, forma) {
  var i, s = '';
  if (forma === 'barra') {
    var lw = tam / fatias;
    for (i = 0; i < fatias; i++) {
      s += '<rect x="' + (i * lw) + '" y="0" width="' + lw + '" height="' + (tam / 3) +
           '" fill="' + (pint[i] ? cor : '#fff') + '" stroke="#5b3fd8" stroke-width="2"' +
           (clicavel ? ' onclick="toggleFatia(' + i + ')" style="cursor:pointer"' : '') + '/>';
    }
    return '<svg viewBox="0 0 ' + tam + ' ' + (tam / 3) + '" style="width:100%;max-width:300px">' + s + '</svg>';
  }
  var c = tam / 2, r = c - 3, gr = 360 / fatias;
  for (i = 0; i < fatias; i++) {
    var a1 = (-90 + i * gr) * Math.PI / 180, a2 = (-90 + (i + 1) * gr) * Math.PI / 180;
    var x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1);
    var x2 = c + r * Math.cos(a2), y2 = c + r * Math.sin(a2);
    var grande = gr > 180 ? 1 : 0;
    var d = 'M' + c + ',' + c + ' L' + x1.toFixed(1) + ',' + y1.toFixed(1) +
            ' A' + r + ',' + r + ' 0 ' + grande + ',1 ' + x2.toFixed(1) + ',' + y2.toFixed(1) + ' Z';
    s += '<path d="' + d + '" fill="' + (pint[i] ? cor : '#fff') + '" stroke="#5b3fd8" stroke-width="2"' +
         (clicavel ? ' onclick="toggleFatia(' + i + ')" style="cursor:pointer"' : '') + '/>';
  }
  return '<svg viewBox="0 0 ' + tam + ' ' + tam + '" style="width:' + (clicavel ? '210px' : '120px') + ';max-width:100%">' + s + '</svg>';
}

function telaFracao(a) {
  var r = rodaAtual(), res = ativ.ultimo, cor = r.cor || '#7c5cff', corpo, fb = '';

  if (r.modo === 'comparar') {
    corpo = '<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:12px 0">' +
      r.opcoes.map(function (o, i) {
        var pint = {}; for (var k = 0; k < (o.pintar || 0); k++) pint[k] = 1;
        var sel = ativ.dados.escolha === i;
        return '<div onclick="escolherRoda(' + i + ')" style="cursor:pointer;text-align:center;padding:8px;' +
          'border:3px solid ' + (sel ? '#5b3fd8' : 'transparent') + ';border-radius:14px">' +
          svgFracao(o.fatias, pint, 120, cor, false, o.forma) +
          '<div style="font-weight:800;font-size:17px;color:#5b3fd8;margin-top:4px">' + o.rotulo + '</div></div>';
      }).join('') + '</div>';
  } else {
    corpo = '<div style="text-align:center;margin:12px 0">' +
      svgFracao(r.fatias, ativ.dados.pintadas, 210, cor, true, r.forma) +
      '<div style="font-size:15px;margin-top:8px"><b>' + Object.keys(ativ.dados.pintadas).length +
      '</b> de ' + r.fatias + ' fatias pintadas</div></div>';
  }

  if (res) {
    fb = res.iguais
      ? '<div class="box ex"><b>Isso!</b> ' + (r.explica || '') + '</div>'
      : '<div class="box dica"><b>Quase!</b> ' +
        (res.comparar ? (r.explica || '') :
         'Você pintou ' + res.contou + ' de ' + res.fatias + ', e a fração pede ' + res.esperado +
         '. O número de baixo diz em quantas partes o inteiro foi dividido; o de cima, quantas pintar.') +
        '</div>';
  }

  return '<div class="card"><div class="qn">' + r.enunciado + '</div>' + corpo + fb +
    (ativ.conferido
      ? '<button class="btn lg" onclick="proximaRoda()">' +
        (ativ.dados.roda + 1 >= a.rodas.length ? 'Ver resultado 🏁' : 'Próxima →') + '</button>'
      : '<button class="btn lg" onclick="conferirFracao()">Conferir ✓</button>') + '</div>';
}

/* ---------- 3c. Reta numérica ---------- */
/* "Números decimais: identificação" e "organize a reta numérica colocando as frações"
   são pedidos literais do cronograma e da apostila. Numa alternativa de a) a d) a
   criança escolhe sem saber por quê; aqui ela aponta o lugar na reta, que é o gesto
   da prova. A reta é dividida em `divisoes` passos e a resposta é o índice do passo. */
function prepararReta(a) {
  ativ.dados = { i: 0, escolha: null };
}
function retaAtual() { return ativAtual().itens[ativ.dados.i]; }
function marcarReta(k) {
  if (ativ.conferido) return;
  ativ.dados.escolha = k;
  render();
}
function conferirReta() {
  var r = retaAtual(), ok = ativ.dados.escolha === r.certa;
  ativ.conferido = true;
  ativ.ultimo = { iguais: ok, escolha: ativ.dados.escolha, certa: r.certa };
  if (ok) ativ.acertos++;
  render();
}
function proximaReta() {
  var a = ativAtual();
  if (ativ.dados.i + 1 >= a.itens.length) return fecharAtividade();
  ativ.dados.i++; ativ.dados.escolha = null; ativ.conferido = false; ativ.ultimo = null;
  render();
}
function telaReta(a) {
  var r = retaAtual(), res = ativ.ultimo, n = r.divisoes, pontos = '';
  for (var k = 0; k <= n; k++) {
    var x = (k / n) * 100;
    var sel = ativ.dados.escolha === k;
    var certo = ativ.conferido && k === r.certa;
    var cor = certo ? '#22c55e' : (sel ? '#5b3fd8' : '#fff');
    var rot = (r.rotulos && r.rotulos[k]) || '';
    pontos += '<div onclick="marcarReta(' + k + ')" style="position:absolute;left:' + x +
      '%;top:0;transform:translateX(-50%);cursor:pointer;text-align:center">' +
      '<div style="width:' + (sel || certo ? 20 : 13) + 'px;height:' + (sel || certo ? 20 : 13) +
      'px;background:' + cor + ';border:2px solid #5b3fd8;border-radius:50%;margin:0 auto"></div>' +
      '<div style="font-size:11px;color:#5b3fd8;font-weight:700;margin-top:3px;white-space:nowrap">' + rot + '</div>' +
      '</div>';
  }
  var fb = '';
  if (res) {
    fb = res.iguais
      ? '<div class="box ex"><b>Isso!</b> ' + (r.explica || '') + '</div>'
      : '<div class="box dica"><b>Quase!</b> O ponto certo está em verde. ' + (r.explica || '') + '</div>';
  }
  return '<div class="card"><div class="qn">' + r.enunciado + '</div>' +
    '<div style="position:relative;height:56px;margin:26px 6px 10px">' +
    '<div style="position:absolute;left:0;right:0;top:6px;height:3px;background:#c9c2f0"></div>' +
    pontos + '</div>' + fb +
    (ativ.conferido
      ? '<button class="btn lg" onclick="proximaReta()">' +
        (ativ.dados.i + 1 >= a.itens.length ? 'Ver resultado 🏁' : 'Próxima →') + '</button>'
      : '<button class="btn lg" onclick="conferirReta()">Conferir ✓</button>') + '</div>';
}

/* ---------- 4. Escrita (ditado e resposta curta) ---------- */
function conferirEscrita() {
  var a = ativAtual(), item = a.itens[ativ.i];
  var el = document.getElementById('respTxt');
  var texto = el ? el.value : '';
  var r = conferirTexto(texto, item);
  ativ.tentativas++;
  ativ.conferido = true;
  ativ.ultimo = r;
  ativ.resp[ativ.i] = texto;
  // acerta na 1ª tentativa vale ponto cheio; acertar depois de tentar de novo
  // continua valendo — o objetivo é aprender, não pegar de primeira.
  if (r.ok && !ativ.jaContou) { ativ.acertos++; ativ.jaContou = true; }
  render();
  /* O professor entra SOZINHO (06/09/2026, pedido do Heitor: "não quero que a
     criança tenha que ir lá e clicar"). Antes era um botão, e criança de 9 anos
     não clica em "pedir ajuda" — ela reescreve no chute ou pula.

     Só quando ERROU e escreveu alguma coisa: com a resposta certa o app já
     responde na hora ("Isso mesmo!" + a explicação), e chamar o LLM para dizer
     parabéns custaria dinheiro e 20 segundos sem ensinar nada.

     O determinístico continua aparecendo ANTES e independe disto — o render()
     acima já pintou a dica. O professor chega por cima, quando chegar. */
  if (!r.ok && !r.vazio) pedirAjuda(true);
}

function tentarDeNovo() {
  /* Descarta o pedido em voo: a partir daqui o texto na tela é outro, e o
     feedback que estava vindo já não se refere ao que ela escreveu. */
  resetTutor();
  ativ.conferido = false; ativ.ultimo = null; render();
}

function proximaEscrita() {
  resetTutor();
  var a = ativAtual();
  if (ativ.i + 1 >= a.itens.length) return fecharAtividade();
  ativ.i++; ativ.conferido = false; ativ.ultimo = null; ativ.jaContou = false;
  ativ.tentativas = 0; render();
}

function tocarDitado() {
  var a = ativAtual(), item = a.itens[ativ.i];
  if (!item.audio) return;
  try { tocarSeq([URL_NARR + item.audio + '.mp3' + AUDV]); } catch (e) {}
}

/* ---------- 5. Ordenar ---------- */
function prepararOrdenar(a) {
  var idx = a.etapas.map(function (_, i) { return i; });
  for (var i = idx.length - 1; i > 0; i--) {
    var j = (Math.random() * (i + 1)) | 0; var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
  }
  // embaralhado que sai na ordem certa não é desafio: embaralha de novo
  if (idx.every(function (v, i) { return v === i; })) idx.reverse();
  ativ.dados = { ordem: idx, sel: null };
}

function pegarEtapa(pos) {
  if (ativ.conferido) return;
  var d = ativ.dados;
  if (d.sel === null) { d.sel = pos; }
  else if (d.sel === pos) { d.sel = null; }
  else { var t = d.ordem[d.sel]; d.ordem[d.sel] = d.ordem[pos]; d.ordem[pos] = t; d.sel = null; }
  render();
}

function conferirOrdenar() {
  var certo = ativ.dados.ordem.every(function (v, i) { return v === i; });
  ativ.conferido = true;
  ativ.ultimo = {
    certo: certo,
    // quantas peças estão no lugar — devolve progresso em vez de só "errou"
    noLugar: ativ.dados.ordem.filter(function (v, i) { return v === i; }).length
  };
  if (certo) ativ.acertos = 1;
  render();
}

/* ---------- 6. Memória ---------- */
function prepararMemoria(a) {
  var cartas = [];
  a.pares.forEach(function (p, i) {
    cartas.push({ par: i, txt: p.a, lado: 'a' });
    cartas.push({ par: i, txt: p.b, lado: 'b' });
  });
  for (var i = cartas.length - 1; i > 0; i--) {
    var j = (Math.random() * (i + 1)) | 0; var t = cartas[i]; cartas[i] = cartas[j]; cartas[j] = t;
  }
  ativ.dados = { cartas: cartas, viradas: [], achados: {}, travado: false, erros: 0 };
}

function virarCarta(i) {
  var d = ativ.dados;
  if (d.travado || d.achados[d.cartas[i].par] || d.viradas.indexOf(i) >= 0) return;
  d.viradas.push(i);
  if (d.viradas.length < 2) { render(); return; }
  var a = d.cartas[d.viradas[0]], b = d.cartas[d.viradas[1]];
  if (a.par === b.par) {
    d.achados[a.par] = 1; d.viradas = []; ativ.acertos++;
    try { tocarSeq([URL_NARR + '_quiz/_int/' + ativ.mat + '-ok-' + sorteiaInterj(ativ.mat, 'ok') + '.mp3' + AUDV]); } catch (e) {}
    if (Object.keys(d.achados).length === ativAtual().pares.length) {
      render(); setTimeout(fecharAtividade, 700); return;
    }
  } else {
    d.travado = true; d.erros++;
    // 1,1s com as duas viradas: tempo de ler e guardar, que é o ponto do jogo
    setTimeout(function () { d.viradas = []; d.travado = false; render(); }, 1100);
  }
  render();
}

/* ---------- 7. Telas ---------- */
function telaAtividade() {
  var a = ativAtual();
  var t = TERRITORIOS.find(function (x) { return x.id === ativ.mat; });
  var topo = '<div class="hdr"><button class="voltar" onclick="pararSolto();view={tela:\'territorio\',terr:\'' +
    ativ.mat + '\'};render()">‹ voltar</button>' +
    '<div class="qprog">' + a.emoji + ' ' + a.titulo + '</div></div>';

  if (ativ.fim) { app.innerHTML = topo + telaFimAtividade(a, t); return; }

  var corpo = a.tipo === 'malha'   ? telaMalha(a)
            : a.tipo === 'fracao'  ? telaFracao(a)
            : a.tipo === 'reta'    ? telaReta(a)
            : a.tipo === 'escrita' ? telaEscrita(a)
            : a.tipo === 'ordenar' ? telaOrdenar(a)
            : a.tipo === 'memoria' ? telaMemoria(a) : '';
  app.innerHTML = topo + corpo;
  var el = document.getElementById('respTxt');
  if (el && !ativ.conferido) { try { el.focus(); } catch (e) {} }
}

function telaFimAtividade(a, t) {
  var total = totalPassosAtiv(), nota = Math.round((ativ.acertos / total) * 4);
  var msg = nota >= 4 ? 'Perfeito! Você dominou essa.'
          : nota >= 2 ? 'Muito bem! Dá pra refazer e chegar no ouro.'
          : 'Bom começo! Refaz com calma que você chega lá.';
  return '<div class="card" style="text-align:center">' +
    '<div style="font-size:52px">' + (nota >= 4 ? '🏅' : nota >= 2 ? '🌟' : '💪') + '</div>' +
    '<h2 style="margin:6px 0">' + ativ.acertos + ' de ' + total + '</h2>' +
    '<p style="color:#7d76a8">' + msg + '</p>' +
    '<p style="font-size:13px;color:#7d76a8">+' + (nota * 25) + ' XP</p>' +
    '<button class="btn lg" style="background:linear-gradient(90deg,' + t.cor + ',' + sombra(t.cor) + ')" ' +
    'onclick="iniciarAtividade(\'' + ativ.mat + '\')">Jogar de novo 🔁</button>' +
    '<button class="btn sec" style="margin-top:8px" onclick="view={tela:\'territorio\',terr:\'' +
    ativ.mat + '\'};render()">Voltar ao território</button></div>';
}

/* malha: grid clicável. O contador anda junto com o dedo da criança.

   DESENHO x RESPOSTA são coisas diferentes. `celulas` é o que a criança tem de marcar;
   `desenho` (opcional) é a figura que já está lá na folha. Enquanto os dois eram o mesmo
   campo, só dava para pedir "conte a figura" — e a apostila da escola pede também "qual a
   área que a barra NÃO ocupa" e "quantas cerâmicas faltam para completar o piso", que são
   justamente o contrário: a figura aparece pintada e a resposta é o vazio em volta. */
function telaMalha(a) {
  var f = malhaFig(), m = ativ.dados.marcados, n = f.cols * f.linhas, cels = '';
  var des = f.desenho || f.celulas;
  for (var i = 0; i < n; i++) {
    var certa = f.celulas.indexOf(i) >= 0, pint = des.indexOf(i) >= 0, mk = !!m[i];
    var bg = ativ.conferido
      ? (certa && mk ? '#b7e4c7' : certa ? '#ffe08a' : mk ? '#ffc9c9' : (pint ? '#ede9fe' : '#fff'))
      : (mk ? '#c7d2fe' : (pint ? '#ede9fe' : '#fff'));
    var borda = pint && !ativ.conferido ? '2px solid ' + (f.cor || '#8b5cf6') : '1px solid #dcd7f0';
    /* `numeros` (18/09/2026): a mesma malha vira tabela de números — é o exercício
       "pinte os múltiplos" da apostila. A célula i mostra `numeros + i` (em geral 1). */
    var rot = f.numeros != null
      ? '<span style="font-weight:700;font-size:14px;color:#3b3663">' + (f.numeros + i) + '</span>' : '';
    cels += '<div onclick="togglecel(' + i + ')" style="aspect-ratio:1;background:' + bg +
      ';border:' + borda + ';border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center">' + rot + '</div>';
  }
  var ehNum = f.numeros != null, coisa = ehNum ? 'número' : 'quadradinho';
  var r = ativ.ultimo;
  var fb = '';
  if (r) {
    /* a unidade vem da figura: a apostila usa "um² (unidade de medida)" na malha
       abstrata, mas no exercício da planta do terreno cada quadradinho vale 10 m². */
    var un = f.unidade || 'um²';
    fb = r.iguais && ehNum
      ? '<div class="box ex"><b>Isso! Achou os ' + r.esperado + '.</b><br>' + (f.explica || '') + '</div>'
      : r.iguais
      ? '<div class="box ex"><b>Isso! ' + r.esperado + ' quadradinhos.</b><br>' +
        (f.valor && f.valor !== 1
          ? 'Cada um vale ' + f.valor + ' ' + un + ', então a área é ' + r.esperado + ' × ' + f.valor + ' = <b>' + r.area + ' ' + un + '</b>.'
          : 'Como cada um vale 1 ' + un + ', a área é <b>' + r.area + ' ' + un + '</b>.') + '</div>'
      : '<div class="box dica"><b>Quase!</b> Você marcou ' + r.contou + ' e a resposta certa tem ' + r.esperado + '.' +
        (r.faltando ? '<br>Faltou marcar ' + r.faltando + ' ' + coisa + (r.faltando > 1 ? 's' : '') + ' (em amarelo).' : '') +
        (r.sobrando ? '<br>Você marcou ' + r.sobrando + ' que não entra nessa conta (em vermelho).' : '') +
        (ehNum && f.explica ? '<br>' + f.explica : '') +
        '</div>';
  }
  return '<div class="card"><div class="qn">' + f.enunciado + '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(' + f.cols + ',1fr);gap:3px;max-width:340px;margin:14px auto">' + cels + '</div>' +
    '<div style="text-align:center;font-size:15px;margin:8px 0"><b>' + Object.keys(m).length + '</b> ' + coisa +
    (Object.keys(m).length === 1 ? '' : 's') + ' marcado' + (Object.keys(m).length === 1 ? '' : 's') + '</div>' + fb +
    (ativ.conferido
      ? '<button class="btn lg" onclick="proximaMalha()">' + (ativ.dados.fig + 1 >= a.figuras.length ? 'Ver resultado 🏁' : (ehNum ? 'Próxima tabela →' : 'Próxima figura →')) + '</button>'
      : '<button class="btn lg" onclick="conferirMalha()">Conferir ✓</button>') + '</div>';
}

/* escrita: caixa de texto + feedback que ORIENTA, não só reprova. */
function telaEscrita(a) {
  var item = a.itens[ativ.i], r = ativ.ultimo, fb = '';
  if (r) {
    if (r.ok) {
      fb = '<div class="box ex"><b>Isso mesmo!</b> ' + (item.explica || '') + '</div>';
    } else if (r.vazio) {
      fb = '<div class="box dica">Escreve alguma coisa, nem que seja pouquinho — eu te ajudo a partir daí.</div>';
    } else if (r.critica) {
      fb = '<div class="box dica"><b>Olha a palavrinha.</b> ' + (item.dica || 'Confere de novo com calma.') + '</div>';
    } else if (r.faltou && r.faltou.length) {
      fb = '<div class="box dica"><b>Você está no caminho!</b>' +
        (r.acertou.length ? ' Já falou de <b>' + r.acertou.map(function (x) { return x.nome; }).join('</b> e <b>') + '</b>.' : '') +
        '<br>Falta dizer algo sobre <b>' + r.faltou.map(function (x) { return x.nome; }).join('</b> e <b>') + '</b>. Tenta reescrever incluindo isso.</div>';
    } else {
      fb = '<div class="box dica"><b>Ainda não.</b> ' + (item.dica || '') + ' Tenta de novo!</div>';
    }
  }
  var audio = item.audio
    ? '<button class="btn sec" style="max-width:280px;margin:4px auto 12px" onclick="tocarDitado()">🔊 Ouvir de novo</button>' : '';
  var acoes = !ativ.conferido
    ? '<button class="btn lg" onclick="conferirEscrita()">Conferir ✓</button>'
    : (r && r.ok
        ? '<button class="btn lg" onclick="proximaEscrita()">' + (ativ.i + 1 >= a.itens.length ? 'Ver resultado 🏁' : 'Próxima →') + '</button>'
        /* Faltou algo: o professor entra SOZINHO (ver conferirEscrita). O botão de
           reescrever some só quando ele termina de falar, para ela ler antes de
           sair digitando de novo.
           "Pular por agora" fica de pé enquanto o professor está lendo: com a via
           rápida fora do ar a resposta leva ~20 s, e sumir com a saída deixaria a
           criança esperando um pedido que ela nem fez. Ela só perde o botão quando
           há de fato um texto do professor na tela para ler. */
        : (tutorEstado && tutorEstado.fase === 'pronto'
            ? ''
            : '<button class="btn lg" onclick="tentarDeNovo()">Reescrever ✏️</button>') +
          blocoTutor(a) +
          (tutorEstado && tutorEstado.fase === 'pronto'
            ? ''
            : '<button class="btn sec" style="margin-top:8px" onclick="proximaEscrita()">Pular por agora</button>'));
  return '<div class="card">' +
    '<div class="qprog">Pergunta ' + (ativ.i + 1) + ' de ' + a.itens.length + '</div>' +
    '<div class="qn">' + item.p + '</div>' + audio +
    '<textarea id="respTxt" ' + (ativ.conferido ? 'readonly' : '') +
    ' style="width:100%;min-height:' + (item.audio ? '62' : '96') + 'px;padding:11px;border:2px solid #dcd7f0;border-radius:12px;font-size:16px;font-family:inherit;box-sizing:border-box" ' +
    'placeholder="Escreve aqui do seu jeito...">' + (ativ.resp[ativ.i] || '') + '</textarea>' +
    fb + acoes + '</div>';
}

function telaOrdenar(a) {
  var d = ativ.dados, r = ativ.ultimo, itens = '';
  d.ordem.forEach(function (idOrig, pos) {
    var certo = ativ.conferido && idOrig === pos;
    var errado = ativ.conferido && idOrig !== pos;
    var bg = certo ? '#b7e4c7' : errado ? '#ffc9c9' : d.sel === pos ? '#c7d2fe' : '#fff';
    itens += '<div onclick="pegarEtapa(' + pos + ')" style="background:' + bg +
      ';border:1px solid #dcd7f0;border-radius:12px;padding:11px 13px;margin:7px 0;cursor:pointer;display:flex;gap:10px;align-items:center">' +
      '<b style="color:#7d76a8;min-width:20px">' + (pos + 1) + '.</b><span>' + a.etapas[idOrig] + '</span></div>';
  });
  var fb = r ? (r.certo
    ? '<div class="box ex"><b>Na ordem certa!</b> ' + (a.explica || '') + '</div>'
    : '<div class="box dica"><b>' + r.noLugar + ' de ' + a.etapas.length + ' já estão no lugar certo</b> (em verde).<br>Troca as vermelhas de posição: toca numa e depois na outra.</div>') : '';
  return '<div class="card"><div class="qn">' + a.instrucao + '</div>' + itens + fb +
    (ativ.conferido && r && r.certo
      ? '<button class="btn lg" onclick="fecharAtividade()">Ver resultado 🏁</button>'
      : ativ.conferido
        ? '<button class="btn lg" onclick="ativ.conferido=false;ativ.ultimo=null;render()">Tentar de novo 🔁</button>'
        : '<button class="btn lg" onclick="conferirOrdenar()">Conferir ✓</button>') + '</div>';
}

function telaMemoria(a) {
  var d = ativ.dados, cartas = '';

    cartas += '<div onclick="virarCarta(' + i + ')" style="min-height:74px;display:flex;align-items:center;' +

      'border:2px solid ' + (achou ? '#7ac77a' : '#dcd7f0') + ';background:' +

      (virada ? '#2a2350' : 'transparent') + '">' + (virada ? c.txt : '?') + '</div>';
  });
  return '<div class="card"><div class="qn">' + a.instrucao + '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0">' + cartas + '</div>' +
    '<div style="text-align:center;color:#7d76a8;font-size:13.5px">' +

    (d.erros ? ' · ' + d.erros + ' tentativa' + (d.erros > 1 ? 's' : '') + ' errada' + (d.erros > 1 ? 's' : '') : '') +

}

/* ---------- 8. Tutor ----------
   A criança escreve, o app confere sozinho (instantâneo) e, quando faltou alguma
   ideia, oferece pedir ajuda ao professor. Aí a resposta vai para a tabela `tutor`
   do Supabase, o Claudinho responde com o Claude em ~20 s e o app busca de volta.

   O que vai: pergunta, o que ela escreveu e o diagnóstico (quais ideias apareceram
   e quais faltaram). NUNCA o nome — só o id do aparelho, que é um uuid local. São
   25 crianças de outras famílias.

   O feedback nunca é bloqueante: se a rede cair ou demorar, ela segue jogando. */
var tutorEstado = null;   // {id, fase:'enviando'|'lendo'|'pronto'|'erro', texto}
var tutorTimer = null;
/* Contador de pedidos. Toda resposta que chega carrega o número do pedido que a
   originou; se a criança já reescreveu ou passou de pergunta nesse meio-tempo, o
   número mudou e a resposta velha é descartada em vez de aparecer por cima do
   texto novo. Com o tutor automático isso deixou de ser detalhe: antes ela só
   pedia ajuda e esperava parada, agora o pedido sai sozinho e ela continua
   mexendo enquanto ele viaja. */
var tutorSeq = 0;
var tutorCache = {};      // pergunta+resposta já respondida -> texto (não repete a chamada)
var tutorChamadas = {};   // quantas vezes o professor já entrou sozinho em cada item
var TUTOR_AUTO_MAX = 4;   // depois disso ela ainda pode chamar no botão, mas não sai sozinho

/* Um só lugar para largar o pedido em voo: zera o estado, mata o polling e
   invalida a resposta que ainda está vindo (tutorSeq). Estava copiado em quatro
   pontos, e o que esquecia de invalidar deixava o feedback velho aparecer sobre
   a pergunta seguinte. */
function resetTutor() { tutorSeq++; tutorEstado = null; if (tutorTimer) clearTimeout(tutorTimer); }

function cabTutor(extra) {
  var c = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY,
            'Content-Type': 'application/json', 'x-aparelho': estado.id };
  if (extra) for (var k in extra) c[k] = extra[k];
  return c;
}

async function pedirAjuda(auto) {
  var a = ativAtual(), item = a.itens[ativ.i], r = ativ.ultimo;
  var texto = ativ.resp[ativ.i] || '';
  if (!texto.trim()) return;
  var chaveItem = ativ.mat + '#' + ativ.i;
  var chaveTexto = chaveItem + '|' + normTxt(texto);

  /* Já respondeu exatamente a esta resposta: reaproveita. Sem isto, conferir duas
     vezes o mesmo texto gastaria duas chamadas para dizer a mesma coisa — e no
     automático isso deixa de ser hipótese, porque o pedido sai a cada "Conferir". */
  if (tutorCache[chaveTexto]) {
    tutorEstado = { fase: 'pronto', texto: tutorCache[chaveTexto] }; render(); return;
  }
  if (auto) {
    /* Teto por pergunta. O professor entrar sozinho é o pedido; entrar sem fim numa
       criança que insiste na mesma pergunta viraria conta e espera à toa. Depois do
       teto ela continua podendo chamar no botão. */
    tutorChamadas[chaveItem] = (tutorChamadas[chaveItem] || 0) + 1;
    if (tutorChamadas[chaveItem] > TUTOR_AUTO_MAX) { tutorChamadas[chaveItem]--; return; }
  }

  var meu = ++tutorSeq;
  var atual = function () { return meu === tutorSeq; };
  tutorEstado = { fase: 'enviando', auto: !!auto, seq: meu }; render();
  var corpo = {
    aparelho: estado.id, materia: ativ.mat, item: item.id || (ativ.mat + '-' + ativ.i),
    pergunta: String(item.p).replace(/<[^>]+>/g, ''),
    resposta: texto.slice(0, 2000),
    diagnostico: {
      acertou: (r && r.acertou || []).map(function (x) { return x.nome; }),
      faltou: (r && r.faltou || []).map(function (x) { return x.nome; })
    }
  };
  /* Dois caminhos, nesta ordem:
     1. Edge Function -- resposta na hora (~2 s). Precisa de ANTHROPIC_API_KEY nos
        secrets do Supabase; enquanto nao houver, ela responde 404 ou 502.
     2. Tabela + Claudinho -- ~13 s, usa a subscription e sempre funciona.
     Assim o instantaneo entra sozinho no dia do deploy, sem mexer no app. */
  try {
    var rapida = await fetch(SUPA_URL + '/functions/v1/tutor', {
      method: 'POST', headers: cabTutor(), body: JSON.stringify(corpo)
    });
    if (rapida.ok) {
      var jr = await rapida.json();
      if (jr && jr.feedback) {
        tutorCache[chaveTexto] = jr.feedback;
        if (!atual()) return;                 // ela já reescreveu: resposta velha não entra
        tutorEstado = { fase: 'pronto', texto: jr.feedback, seq: meu }; render(); return;
      }
    }
  } catch (e) { /* sem Edge Function publicada: segue pelo Claudinho */ }

  try {
    var resp = await fetch(SUPA_URL + '/rest/v1/tutor', {
      method: 'POST', headers: cabTutor({ 'Prefer': 'return=representation' }),
      body: JSON.stringify([corpo])
    });
    if (!resp.ok) throw new Error('http ' + resp.status);
    var linha = (await resp.json())[0];
    if (!atual()) return;
    tutorEstado = { id: linha.id, fase: 'lendo', desde: Date.now(), seq: meu,
                    auto: !!auto, chaveTexto: chaveTexto };
    render();
    buscarFeedback();
  } catch (e) {
    if (!atual()) return;
    /* Erro no pedido AUTOMÁTICO não vira tela de erro: a criança não pediu nada,
       e um "não consegui falar com o professor" a cada resposta errada (sem
       internet, por exemplo) seria só ruído por cima da dica que já está lá. No
       pedido manual ela está esperando, então o aviso continua aparecendo. */
    tutorEstado = auto ? null : { fase: 'erro' };
    render();
  }
}

function buscarFeedback() {
  if (tutorTimer) clearTimeout(tutorTimer);
  if (!tutorEstado || tutorEstado.fase !== 'lendo') return;
  // desiste depois de 90 s: melhor dizer que não deu do que deixar girando pra sempre
  if (Date.now() - tutorEstado.desde > 90000) {
    tutorEstado = tutorEstado.auto ? null : { fase: 'erro' }; render(); return;
  }
  var meu = tutorEstado.seq, auto = tutorEstado.auto, chaveTexto = tutorEstado.chaveTexto;
  tutorTimer = setTimeout(async function () {
    try {
      var r = await fetch(SUPA_URL + '/rest/v1/tutor?id=eq.' + tutorEstado.id +
                          '&select=estado,feedback', { headers: cabTutor() });
      var d = r.ok ? await r.json() : null;
      if (d && d[0] && d[0].estado === 'pronto' && d[0].feedback) {
        if (chaveTexto) tutorCache[chaveTexto] = d[0].feedback;
        if (meu !== tutorSeq) return;         // já não é a pergunta da tela
        tutorEstado = { fase: 'pronto', texto: d[0].feedback, seq: meu }; render(); return;
      }
      if (d && d[0] && d[0].estado === 'erro') {
        if (meu !== tutorSeq) return;
        tutorEstado = auto ? null : { fase: 'erro' }; render(); return;
      }
    } catch (e) { /* rede oscilou: tenta de novo */ }
    buscarFeedback();
  }, 2500);
}

function fecharTutor() { resetTutor(); tentarDeNovo(); }

function blocoTutor(a) {
  var pnome = (PERSONAS[ativ.mat] && PERSONAS[ativ.mat].nome) || 'o professor';
  if (!tutorEstado) {
    return '<button class="btn sec" style="margin-top:8px" onclick="pedirAjuda()">' +
           '🧑‍🏫 Pedir ajuda ' + (a.tipo === 'escrita' ? 'ao professor' : '') + '</button>';
  }
  if (tutorEstado.fase === 'enviando' || tutorEstado.fase === 'lendo') {
    return '<div class="box dica" style="display:flex;gap:10px;align-items:center">' +
      '<div class="pulsa" style="font-size:22px">👀</div>' +
      '<div>O professor está lendo o que você escreveu...<br>' +
      '<span style="font-size:12.5px;color:#7d76a8">pode levar uns segundinhos</span></div></div>';
  }
  if (tutorEstado.fase === 'erro') {
    return '<div class="box dica">Não consegui falar com o professor agora. ' +
      'Segue com a dica de cima que você chega lá!' +
      '<br><button class="btn sec" style="margin-top:8px" onclick="tutorEstado=null;render()">ok</button></div>';
  }
  return '<div class="card" style="background:linear-gradient(135deg,#fff,#eef6ff);border:2px solid #b9d6f2;margin-top:10px">' +
    '<div style="display:flex;gap:10px"><div style="font-size:26px">🧑‍🏫</div>' +
    '<div style="flex:1"><div style="font-weight:800;color:#2a5d8f;margin-bottom:4px">' + pnome + '</div>' +
    '<div style="line-height:1.5">' + tutorEstado.texto + '</div></div></div>' +
    '<button class="btn lg" style="margin-top:10px" onclick="fecharTutor()">Reescrever ✏️</button></div>';
}

/* ---- mapa ---- */
function telaMapa(){
  const md = missaoDoDia();
  let hoje = '';
  if(md){
    hoje = `
    <div class="hoje">
      <div class="lab">${md.revisao?'Revisão de hoje':'Missão de hoje'}</div>
      <div class="ms">${md.terr.emoji} ${md.miss.titulo}</div>
      <button onclick="irMissao('${md.terr.id}','${md.miss.id}')">
        ${md.revisao?'Revisar agora':'Começar agora'} →</button>
    </div>`;
  }
  const cards = TERRITORIOS.map(t=>{
    const ms = missoesDe(t.id);
    const ativo = ms.length>0;
    const feitas = ms.filter(m=>feita(m.id)).length;
    const pct = ativo ? Math.round(feitas/ms.length*100) : 0;
    const medal = territorioOuro(t.id) ? '🏆' : (territorioCompleto(t.id) ? '🥇' : '');
    return `
    <div class="terr" style="background:linear-gradient(135deg,${t.cor},${sombra(t.cor)})"
         ${ativo?`onclick="irMateria('${t.id}')"`:''}>
      ${medal?`<div class="med">${medal}</div>`:''}
      <div class="em">${t.emoji}</div>
      <div class="nm">${t.nome}</div>
      <div class="pg">${ativo? feitas+'/'+ms.length+' missões' : 'mapa em preparo'}</div>
      <div class="cd">${textoContagem(t.id)}</div>
      ${ativo && parcial(t.id)?`<div class="cd parc">📥 ainda vem mais</div>`:''}
      ${ativo?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}
      ${ativo?'':`<div class="lock"><span class="bg">🔒</span>em breve</div>`}
    </div>`;
  }).join('');

  app.innerHTML = `
    ${hud()}
    <div class="card welcome" style="margin-bottom:8px">
      ${fraseMapa()}
      <br><button class="btn" style="margin-top:10px;max-width:260px;margin-left:auto;margin-right:auto" onclick="ouvirNome()">🔊 Ouvir o Cronos</button>
    </div>
    <div class="titulo">🗺️ Mapa da Expedição</div>
    <div class="lead">Toque num território para estudar. Cada prova é o desafio final dele!</div>
    ${avisoConteudo()}
    <button class="btn" style="width:100%;margin:8px 0 4px" onclick="irRanking()">🏆 Ver o Placar da Turma</button>
    ${hoje}
    <div class="terrs">${cards}</div>
    <div class="rodape">StepQuest • 3ª Avaliação • <a onclick="zerar()">recomeçar do zero</a></div>`;
}
function sombra(hex){
  // escurece a cor para o gradiente
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)-40, g=((n>>8)&255)-40, b=(n&255)-40;
  r=Math.max(0,r); g=Math.max(0,g); b=Math.max(0,b);
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}

/* ---- território ---- */
function telaTerritorio(){
  const t = TERRITORIOS.find(x=>x.id===view.terr);
  const ms = missoesDe(t.id);
  const lista = ms.map(m=>{

        <div class="t">${m.titulo}</div>
