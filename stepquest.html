      </div>
      ${selo?`<div class="selo">${selo}</div>`
            :`<div class="go" style="background:${t.cor}">estudar</div>`}
    </div>`;
  }).join('');

  var pnome = (PERSONAS[t.id]||{}).nome || 'o professor';
  app.innerHTML = `
    ${hud()}
    <div class="topbar">
      <button class="voltar" onclick="irMapa()">← Mapa</button>
      <div class="titulo" style="margin:0">${t.emoji} ${t.nome}</div>
    </div>
    <div class="card">

/* ---- ler-junto (Cronos narra o card, a linha acende) ---- */
function pararNarracao(){
  if(narrAudio){ narrAudio.ontimeupdate=null; narrAudio.onended=null; narrAudio.pause(); narrAudio=null; }
  document.querySelectorAll('.lnr').forEach(function(s){ s.classList.remove('lendo'); });
  var b=document.getElementById('btnLer'); if(b) b.textContent='🔊 Cronos lê pra mim';
}
function toggleLerAuto(){ estado.lerAuto=!estado.lerAuto; salvar(); pararNarracao(); render(); }
function lerJunto(mid){
  var btn=document.getElementById('btnLer');
  if(narrAudio){ pararNarracao(); return; }
  btn.textContent='⏳ carregando a voz do Cronos...';
  fetch(URL_NARR+mid+'.json'+AUDV).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d){ btn.textContent='🔇 narração em breve'; return; }
    narrTimes=d.linhas;
    narrAudio=new Audio(URL_NARR+mid+'.mp3'+AUDV);
    narrAudio.ontimeupdate=function(){
      if(!narrAudio) return;
      var ct=narrAudio.currentTime, idx=0, i;
      for(i=0;i<narrTimes.length;i++){ if(narrTimes[i].t<=ct) idx=i; }
      document.querySelectorAll('.lnr').forEach(function(s,j){
        var on=(j===idx); s.classList.toggle('lendo', on);
        if(on) s.scrollIntoView({block:'center',behavior:'smooth'});
      });
    };
    narrAudio.onended=function(){ pararNarracao(); };
    var p=narrAudio.play();
    if(p && p.then){ p.then(function(){ btn.textContent='⏸ Pausar leitura'; })
                      .catch(function(){ narrAudio=null; btn.textContent='🔊 Cronos lê pra mim'; }); }
    else btn.textContent='⏸ Pausar leitura';
  }).catch(function(){ btn.textContent='🔇 narração indisponível agora'; });
}

/* ---- quiz ---- */
function iniciarQuiz(tid,mid){
  const m = missoesDe(tid).find(x=>x.id===mid);
  // embaralha a ordem das opções de cada questão
  const ordem = m.quiz.map(q=>{
    const idx = q.op.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [idx[i],idx[j]]=[idx[j],idx[i]]; }
    return idx;
  });
  quiz = { tid, mid, q:0, ordem, resp:{}, enviado:false };
  view = { tela:'quiz', terr:tid, miss:mid };
  ultimoQuizLido=null;
  render();
}
function iniciarProva(mat){
  var g=PROVAFINAL[mat]; if(!g) return;
  var pares=g.pares.map(function(p,idx){ return {a:p.a,b:p.b,idx:idx,feito:false}; });
  var dir=pares.map(function(p){return p.idx;});
  for(var i=dir.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=dir[i]; dir[i]=dir[j]; dir[j]=t; }
  provaEstado={mat:mat,pares:pares,dir:dir,selA:null,erro:null,completo:false};
  pararSolto(); view={tela:'prova',terr:mat}; render();
  try{ introAudio=new Audio(URL_NARR+'_provaintro/'+mat+'.mp3'); introAudio.play().catch(function(){}); }catch(e){}
}
function provaSelA(i){ if(provaEstado.pares[i].feito) return; provaEstado.selA=(provaEstado.selA===i?null:i); provaEstado.erro=null; render(); }
function provaMatch(bidx){
  if(provaEstado.selA==null) return;
  if(provaEstado.selA===bidx){
    provaEstado.pares[bidx].feito=true; provaEstado.selA=null; provaEstado.erro=null;
    if(provaEstado.pares.every(function(x){return x.feito;})){

    } else { render(); tocarSeq([URL_NARR+'_quiz/_int/'+provaEstado.mat+'-ok-'+sorteiaInterj(provaEstado.mat,'ok')+'.mp3'+AUDV]); }

function qzQs(){ return missoesDe(quiz.tid).find(function(x){return x.id===quiz.mid;}).quiz; }
function telaQuiz(){
  const t = TERRITORIOS.find(x=>x.id===quiz.tid);
  const qs = qzQs();
  const i = quiz.q;
  const questao = qs[i];
  const ordem = quiz.ordem[i];
  const escolhida = quiz.resp[i];          // índice REAL (na ordem embaralhada)
  const opts = ordem.map((realIdx,pos)=>{
    let cls='opt';
    if(quiz.enviado){
      if(realIdx===questao.correta) cls+=' certa';
      else if(pos===escolhida) cls+=' errada';
    } else if(pos===escolhida) cls+=' sel';
    return `<button class="${cls}" ${quiz.enviado?'disabled':''}
      onclick="marcar(${pos})">${questao.op[realIdx]}</button>`;
  }).join('');

  let feed='', botoes='';
  if(quiz.enviado){
    const acertou = ordem[escolhida]===questao.correta;
    const fbTxt = interjTexto(quiz.tid, acertou?'ok':'no', quiz.fbv||1);
    const seqExtra = (acertou && quiz.seq>=3)
      ? `<div class="seqfogo">${pick(['🔥','⚡','🌟'])} ${quiz.seq} seguidas! ${pick(['Tá pegando fogo!','Imparável!','Que sequência!','Continua assim!'])}</div>` : '';
    feed = `<div class="feed ${acertou?'bom':'ruim'}">
      ${acertou?'✅ ':'❌ '}${fbTxt?fbTxt+'<br>':(acertou?'Isso aí! ':'Quase! ')}${questao.explica}</div>${seqExtra}`;
    botoes = i < qs.length-1
      ? `<button class="btn lg" onclick="proxima()">Próxima →</button>`
      : `<button class="btn lg" onclick="finalizarQuiz()">Ver resultado 🏁</button>`;
  } else {
    botoes = `<button class="btn lg" id="conf" disabled onclick="confirmar()">Confirmar</button>`;
  }

  app.innerHTML = `
    ${hud()}
    <div class="topbar">
      <button class="voltar" onclick="${quiz.prova?`irTerritorio('${t.id}')`:`irMissao('${t.id}','${quiz.mid}')`}">← Sair</button>
      <div class="qprog">${quiz.prova?'🏆 Prova · ':''}Pergunta ${i+1} de ${qs.length}</div>
    </div>
    <div class="card">
      <div class="qn">${questao.p}</div>
      <button class="btn sec" style="max-width:300px;margin:6px auto 12px" onclick="vozQuizEnunciado()">🔊 Ouvir de novo</button>
      ${opts}
      ${feed}
      ${botoes}
    </div>`;
  var chaveQ = quiz.mid+'-'+i+'-'+(quiz.enviado?'e':'p');
  if(chaveQ!==ultimoQuizLido){ ultimoQuizLido=chaveQ;
    if(!quiz.enviado) vozQuizEnunciado();
    else vozQuizFeedback(ordem[escolhida]===questao.correta);
  }
  if(escolhida!=null && !quiz.enviado){
    const c=document.getElementById('conf'); if(c) c.disabled=false;
  }
}
function marcar(pos){
  if(quiz.enviado) return;
  quiz.resp[quiz.q]=pos; render();
}
function confirmar(){
  if(quiz.resp[quiz.q]==null) return;
  var q=qzQs()[quiz.q];
  var ok = quiz.ordem[quiz.q][quiz.resp[quiz.q]]===q.correta;
  quiz.seq = ok ? (quiz.seq||0)+1 : 0;          // acertos seguidos na missão
  quiz.fbv = sorteiaInterj(quiz.tid, ok?'ok':'no');  // trava texto+áudio no mesmo sorteio
  quiz.enviado=true; render();
}
function proxima(){ quiz.q++; quiz.enviado=false; render(); }
function finalizarQuiz(){
  const qs = qzQs();
  let acertos=0;
  qs.forEach((q,i)=>{ if(quiz.ordem[i][quiz.resp[i]]===q.correta) acertos++; });
  const chave = quiz.prova ? ('prova-'+quiz.tid) : quiz.mid;
  const antes = estado.melhores[chave] || 0;
  if(acertos>antes) estado.melhores[chave]=acertos;
  else if(estado.melhores[chave]==null) estado.melhores[chave]=acertos;
  registrarDia();
  salvar();
  enviarRanking();
  view.tela='resultado';
  view._ult = { acertos, total:qs.length, novoRecorde:acertos>antes, prova:quiz.prova };
  render();
}

/* ---- conectores personalizados (parabéns + progresso + próxima, no tom do guia) ---- */
function pick(a){ return (a&&a.length)? a[(Math.random()*a.length)|0] : ''; }
function fraseMapa(){
  var nome = estado.perfil.nome, d = Math.max(0, diasAte(PRIMEIRA_PROVA));
  /* A turma reclamou de ouvir sempre a mesma coisa, então a saudação sorteia entre
     muitas — e fala do momento do ano: a 3ª avaliação (21 a 25/09).
     Sem "pronta"/"exploradora": a lista ALUNOS tem meninos e meninas. */
  var saud = pick([
    'Olá de novo, '+nome+'! 👋','Que bom te ver por aqui, '+nome+'! ✨',
    'Bora pra mais uma, '+nome+'? 💪','E aí, '+nome+'! Vamos explorar? 🧭',
    'De volta à expedição, '+nome+'! 🚀','Salve, '+nome+'! O tempo não para! ⏳',
    'Semana de avaliação na área, '+nome+'! 📚','Chegou quem faltava, '+nome+'! 🌟',
    'A máquina do tempo te esperava, '+nome+'! 🌀','Mais um dia de treino, '+nome+'! 🎯',
    'Que energia boa, '+nome+'! 🔆','Tudo pronto pra avançar, '+nome+'? 🗺️',
    'O mapa está aberto, '+nome+'! 🧭','Vamos com tudo, '+nome+'! ⚡',
    'Time reunido, '+nome+'! 🤝','Cada dia um passo, '+nome+'! 🐾']);
  /* 18/09/2026: com `Math.max(0, d)` a frase travava em "começa hoje" a semana inteira
     de prova. Agora, depois que a primeira prova chega, ela olha a PRÓXIMA data de
     PROVAS e diz quais matérias são — hoje, amanhã ou em N dias. */
  var datas = Object.keys(PROVAS).filter(function(k){ return PROVAS[k] && diasAte(PROVAS[k])>=0; })
                    .sort(function(a,b){ return PROVAS[a]<PROVAS[b]?-1:PROVAS[a]>PROVAS[b]?1:0; });
  var cont;
  if(!datas.length){
    cont = 'A 3ª avaliação passou — que semana! Pode continuar treinando à vontade. 🌟';
  } else {
    var prox = PROVAS[datas[0]], dp = diasAte(prox);
    var quais = datas.filter(function(k){ return PROVAS[k]===prox; })
                     .map(function(k){ var t=TERRITORIOS.filter(function(x){return x.id===k;})[0]; return t?t.nome:k; });
    var lista = quais.length>1 ? quais.slice(0,-1).join(', ')+' e '+quais[quais.length-1] : quais[0];
    cont = dp===0 ? 'Hoje tem prova: <b>'+lista+'</b>. Você se preparou — arrasa lá! 🎯'
      : dp===1 ? 'É <b>amanhã</b>: '+lista+'. Última revisão e bora! 🔥'
      : d<=0 ? 'Próxima prova em <b>'+dp+' dias</b>: '+lista+'. Segue firme! 💪'
      : 'Falta'+(dp>1?'m':'')+' <b>'+dp+' dia'+(dp>1?'s':'')+'</b> pra <b>3ª avaliação</b> (21 a 25/9). Abre com '+lista+' — capricha! 🔥';
  }
  return saud+'<br>'+cont;
}
function conectorTexto(t, pi){
  var c = CONECTORES[t.id];
  var nome = estado.perfil ? estado.perfil.nome : 'exploradora';
  if(!c) return 'Mandou bem, '+nome+'! Bora pra próxima! 🚀';
  var ms = missoesDe(t.id);
  var feitas = ms.filter(function(x){return feita(x.id);}).length, total = ms.length;
  var prox = ms.filter(function(x){return !feita(x.id);})[0];
  // pi (quando dado) força qual "parabens" aparece — pra o áudio de resultado
  // (_res/<mat>-<pi+1>.mp3, gerado na MESMA ordem) ler EXATAMENTE este balão.
  var elogio = (pi!=null && c.parabens[pi]!=null) ? c.parabens[pi] : pick(c.parabens);
  var partes = (feitas>=total) ? [pick(c.completa)]
             : [elogio, pick(c.progresso)].concat(prox?[pick(c.proxima)]:[]);
  return partes.filter(Boolean).join(' ')
    .replace(/\{nome\}/g, nome).replace(/\{feitas\}/g, feitas).replace(/\{total\}/g, total)
    .replace(/\{materia\}/g, t.nome).replace(/\{prox\}/g, prox?prox.titulo:'');
}

  app.innerHTML = `
    ${hud()}
    <div class="card res">
      <div class="big pop">${emoji}</div>
      <div class="nota">${r.acertos} de ${r.total} acertos</div>
      <div>${msg}</div>
      ${r.novoRecorde?`<div class="xp">+<span id="xpnum">0</span> XP de recorde! ⚡</div>`
                     :`<div class="xp" style="background:#eee;color:#777">sem novo recorde desta vez</div>`}
      <div class="cronos" style="margin-top:14px;text-align:left">
        <div class="face">${(PERSONAS[view.terr]||{}).emoji||'👨‍🔬'}</div>
        <div class="balao">${conectorTexto(t, _pi)}</div>
      </div>
      <div class="rkfb" id="rkfb" style="display:none"></div>
      <button class="btn lg" onclick="${r.prova?`iniciarProva('${t.id}')`:`iniciarQuiz('${t.id}','${view.miss}')`}">${r.prova?'Refazer a prova 🔁':'Refazer o desafio 🔁'}</button>
      <button class="btn lg sec" onclick="irTerritorio('${t.id}')">Voltar para ${t.nome}</button>
    </div>`;
  enviarRanking().then(rankingFeedback).then(function(msg){
    var el=document.getElementById('rkfb'); if(el && msg){ el.textContent=msg; el.style.display='block'; }
  });
  if(r.novoRecorde) animarNumero('xpnum', r.acertos*25, 750);
  if(pct===100 || r.novoRecorde) setTimeout(function(){ confete(pct===100?130:70); }, 200);
  tocarSeq([URL_NARR+'_res/'+view.terr+'-'+(_pi!=null?_pi+1:rvar(NVAR.res))+'.mp3'+AUDV]);
}

/* ---- feedback de ranking (subiu posições / pódio) — bem variado ---- */
async function rankingFeedback(){
  var lista = await carregarRanking(); if(!lista || !lista.length) return '';
  /* A posição é procurada pelo NOME, na mesma lista agrupada que a criança vê.
     Procurar por `estado.id` (o uuid do aparelho) deixou de achar a linha desde
     que o placar passou a ser por aluno — e sem posição não sai elogio nenhum. */
  lista = agruparPorNome(lista);
  var meuSlug = slugAluno(estado.perfil.nome);
  var pos = 0, i;
  for(i=0;i<lista.length;i++){ if(slugAluno(lista[i].nome)===meuSlug){ pos=i+1; break; } }
  if(!pos) return '';
  var nome = estado.perfil.nome;
  var ant = estado.ultPos||0; estado.ultPos = pos; salvar();
  var rotulo = pos<=3 ? ['🥇 1º','🥈 2º','🥉 3º'][pos-1] : pos+'º';
  if(ant && pos<ant){
    var d=ant-pos, pl=d>1?'posições':'posição';
    return pick([
      '🚀 UAU, '+nome+'! Você subiu '+d+' '+pl+' e já é '+rotulo+' na turma!',
      '📈 Foguete ligado, '+nome+'! Mais '+d+' '+pl+' — agora você é '+rotulo+'!',
      '⚡ Que escalada! '+nome+', você pulou '+d+' '+pl+' e está em '+rotulo+'!',
      '🔥 Subindo no placar, '+nome+'! '+rotulo+' lugar agora!',
      '🏃 Disparou, '+nome+'! '+d+' '+pl+' pra cima — '+rotulo+' da turma!']);
  }
  if(pos<=3) return pick([
    '🏆 '+nome+', você está no PÓDIO: '+rotulo+' da turma! Que orgulho!',
    '👑 Top da turma! '+nome+', você é '+rotulo+'. Arrasou!',
    '⭐ '+rotulo+' lugar, '+nome+'! Você está voando no placar!']);
  if(!ant) return pick([
    '🎉 '+nome+', você entrou no placar em '+pos+'º! A escalada começou!',
    '📋 Bem-vinda ao placar, '+nome+'! Você está em '+pos+'º. Bora subir!']);
  return pick([
    '💪 Firme em '+pos+'º, '+nome+'! Mais uma missão e você sobe!',
    '😎 '+pos+'º lugar, '+nome+'. O pódio tá logo ali!',
    '🌟 '+nome+', você segue em '+pos+'º. A turma tá de olho!',
    '🧭 Posição '+pos+'º, '+nome+'! Cada acerto te leva mais alto!']);
}

/* ---- joguinho de classificar (bônus) ---- */
function irJogo(mat){
  var g=JOGOS[mat]; if(!g) return;
  var itens=g.itens.map(function(x){return {txt:x.txt,cat:x.cat,feito:false};});
  for(var i=itens.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,tmp=itens[i];itens[i]=itens[j];itens[j]=tmp;}
  jogoEstado={mat:mat,itens:itens,sel:null,erro:null,completo:false};
  pararSolto(); view={tela:'jogo',terr:mat}; render();
}
function jogoSel(i){ if(jogoEstado.itens[i].feito) return; jogoEstado.sel=(jogoEstado.sel===i?null:i); jogoEstado.erro=null; render(); }
function jogoBin(cat){
  if(jogoEstado.sel==null) return;
  var it=jogoEstado.itens[jogoEstado.sel];
  if(it.cat===cat){ it.feito=true; jogoEstado.sel=null; jogoEstado.erro=null;
    if(jogoEstado.itens.every(function(x){return x.feito;})){
      var k='jogo-'+jogoEstado.mat; jogoEstado.bonus=!estado.melhores[k];
      if(jogoEstado.bonus){ estado.melhores[k]=3; salvar(); enviarRanking(); }
      jogoEstado.completo=true;
      setTimeout(function(){ confete(jogoEstado.bonus?110:50); }, 200);
    }
    render();
  } else { jogoEstado.erro=jogoEstado.sel; jogoEstado.sel=null; render(); }
}
function telaJogo(){
  var g=JOGOS[jogoEstado.mat], t=TERRITORIOS.find(function(x){return x.id===jogoEstado.mat;});
  if(jogoEstado.completo){
    app.innerHTML=`${hud()}
      <div class="card res">
        <div class="big pop">🎮🏆</div>
        <div class="nota">Você classificou tudo certo!</div>
        ${jogoEstado.bonus?'<div class="xp">+75 XP de bônus! ⚡</div>':'<div class="xp" style="background:#eee;color:#777">joguinho já dominado</div>'}
        <button class="btn lg" onclick="irJogo('${jogoEstado.mat}')">Jogar de novo 🔁</button>
        <button class="btn lg sec" onclick="irTerritorio('${jogoEstado.mat}')">Voltar para ${t.nome}</button>
      </div>`;
    return;
  }
  var bins=g.categorias.map(function(c){ return '<button class="jbin" onclick="jogoBin(\''+c.id+'\')">'+c.label+'</button>'; }).join('');
  var pool=jogoEstado.itens.map(function(it,i){
    if(it.feito) return '<div class="jitem feito">✓ '+it.txt+'</div>';
    var cls='jitem'+(jogoEstado.sel===i?' sel':'')+(jogoEstado.erro===i?' err':'');
    return '<button class="'+cls+'" onclick="jogoSel('+i+')">'+it.txt+'</button>';
  }).join('');
  var faltam=jogoEstado.itens.filter(function(x){return !x.feito;}).length;
  app.innerHTML=`${hud()}
    <div class="topbar"><button class="voltar" onclick="irTerritorio('${jogoEstado.mat}')">← ${t.nome}</button>
      <div class="qprog">faltam ${faltam}</div></div>
    <div class="titulo" style="margin-top:6px">🎮 ${g.titulo}</div>
    <div class="card">
      <div class="lead" style="color:#5a4fae;margin-bottom:12px">${g.instrucao}</div>
      <div class="jbins">${bins}</div>
      <div class="jpool">${pool}</div>
      <div style="font-size:12px;color:#888;text-align:center;margin-top:10px">Toque numa carta e depois na caixa certa.</div>
    </div>`;
}

/* ---- ranking ---- */
function telaRanking(){
  app.innerHTML = `
    ${hud()}
    <div class="topbar">
      <button class="voltar" onclick="irMapa()">← Mapa</button>
      <div class="titulo" style="margin:0">🏆 Placar da Turma</div>
    </div>
    <div class="lead">Quem mais explorou o tempo! O placar soma TODO o XP: missões,
      prova final (+100), joguinho (+75) e podcast (+50) de cada matéria.</div>
    ${estado.syncPend?'<div class="card" style="background:#fff8e6;border:1px solid #f0d48a;font-size:13.5px">⏳ Seus pontos mais novos ainda não subiram pro placar (sem internet na hora). Eles sobem sozinhos assim que conectar!</div>':''}
    <div id="rklist" class="card">Carregando o placar…</div>
    <div class="rodape">Dica: faça missões e bata seus recordes pra subir! 🌟</div>`;
  enviarRanking().then(carregarRanking).then(function(lista){
    var el=document.getElementById('rklist'); if(!el) return;
    if(lista===null){ el.innerHTML='Não consegui carregar o placar agora. Confira a internet e tente de novo. 🌀'; return; }
    lista = agruparPorNome(lista);          // uma criança, uma linha
    if(!lista.length){ el.innerHTML='Ainda não tem ninguém no placar. Seja a primeira a aparecer! 🚀'; return; }
    var meuSlug = estado.perfil ? slugAluno(estado.perfil.nome) : null;
    el.innerHTML = lista.map(function(r,i){
      var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'º';
      var eu = (slugAluno(r.nome)===meuSlug);
      var estilo = 'display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid #eee;'
        + (eu?'background:#fff3cd;font-weight:800;border-radius:8px;':'');
      return '<div style="'+estilo+'">'
        + '<span style="min-width:34px;text-align:center;font-size:18px">'+medal+'</span>'
        + '<span style="flex:1">'+r.nome+(eu?' (você)':'')+'</span>'
        + '<span style="color:#a06b00;font-weight:700">'+r.pontos+' XP</span></div>';
    }).join('');
  });
}

/* ---- navegação ---- */
let introAudio=null, falaAudio=null, quizAudio=null, ultimoQuizLido=null, podAudio=null;
function tocarPodcast(mat){
  var st=document.getElementById('podst');
  try{ if(podAudio) podAudio.pause();
    podAudio=new Audio(URL_NARR+'_podcast/'+mat+'.mp3');
    if(st) st.textContent='tocando… 🎧';
    podAudio.onended=function(){ var k='pod-'+mat; if(!estado.melhores[k]){ estado.melhores[k]=2; salvar(); enviarRanking(); } if(view.tela==='territorio') render(); };
    var p=podAudio.play(); if(p&&p.catch) p.catch(function(){ if(st) st.textContent='toque pra ouvir'; });
  }catch(e){}
}
function ouvirFala(fc){ try{ if(falaAudio) falaAudio.pause(); falaAudio=new Audio(URL_NARR+'_fala/'+fc+'.mp3'+AUDV); falaAudio.play().catch(function(){}); }catch(e){} }
function pararQuizAudio(){ if(quizAudio){ quizAudio.onended=null; quizAudio.pause(); quizAudio=null; } }
function tocarSeq(urls){ pararQuizAudio(); var k=0; (function next(){ if(k>=urls.length) return; quizAudio=new Audio(urls[k++]); quizAudio.onended=next; quizAudio.onerror=next; var p=quizAudio.play(); if(p&&p.catch) p.catch(function(){}); })(); }
function vozQuizEnunciado(){ var q=qzQs()[quiz.q]; var base=q.vc||(quiz.mid+'-'+quiz.q); var u=[URL_NARR+'_quiz/'+base+'-p.mp3'+AUDV]; if(q.af&&q.fc) u.push(URL_NARR+'_fala/'+q.fc+'.mp3'+AUDV); tocarSeq(u); }
function vozQuizFeedback(ok){ var q=qzQs()[quiz.q]; var base=q.vc||(quiz.mid+'-'+quiz.q); var k=ok?'ok':'no'; var v=quiz.fbv||sorteiaInterj(quiz.tid,k); tocarSeq([URL_NARR+'_quiz/_int/'+quiz.tid+'-'+k+'-'+v+'.mp3'+AUDV, URL_NARR+'_quiz/'+base+'-x.mp3'+AUDV]); }
function pararSolto(){ try{ if(introAudio){introAudio.pause();introAudio=null;} if(audioNome){audioNome.pause();} if(falaAudio){falaAudio.pause();} pararQuizAudio(); if(podAudio){podAudio.pause();} }catch(e){} }
function tocarIntroMateria(id){
  var nm=slugNome(estado.perfil?estado.perfil.nome:'');
  try{
    introAudio=new Audio(URL_NARR+'_saud/'+id+'-'+nm+'.mp3');
    introAudio.onerror=function(){ var p=PERSONAS[id]; if(p&&p.intro){ introAudio=new Audio(URL_NARR+'_elenco/'+p.intro+'.mp3'); introAudio.play().catch(function(){}); } };
    introAudio.play().catch(function(){});
  }catch(e){}
}
function introMateriaTexto(t){
  var p=PERSONAS[t.id]||{}; var nome=estado.perfil?estado.perfil.nome:'exploradora';
  return 'Olá, '+nome+'! Eu sou <b>'+(p.nome||'seu guia')+'</b>. Bora estudar <b>'+t.nome+'</b>? Escolha uma missão aqui embaixo — a prova tá chegando! 🚀';
}
function irMapa(){ pararSolto(); pararNarracao(); view={tela:'mapa'}; render(); if(estado.syncPend) enviarRanking(); }
function irRanking(){ pararSolto(); view={tela:'ranking'}; render(); }
function irTerritorio(id){ pararSolto(); view={tela:'territorio',terr:id}; render(); }
function irMateria(id){ pararSolto(); view={tela:'territorio',terr:id}; render(); tocarIntroMateria(id); }
function irMissao(tid,mid){ pararSolto(); view={tela:'missao',terr:tid,miss:mid}; render(); }
function zerar(){
  if(confirm('Recomeçar a expedição do zero? Todo o progresso será apagado.')){
    var idAparelho = estado.id;          // mantém a MESMA linha no placar da turma
    var perfil = estado.perfil;
    localStorage.removeItem(CHAVE); estado=novoEstado(); estado.id=idAparelho;
    estado.perfil = perfil;
    salvar(); view={tela:'mapa'}; render();
    /* Desde 06/09 o progresso também mora no servidor. Sem apagar lá, a próxima
       sincronização traria tudo de volta e "recomeçar do zero" não zeraria nada. */
    if(perfil){
      var id = idAluno();
      gravarLinha(id, { id:id, nome:perfil.nome, pontos:0, progresso:{}, piso:0,
                        atualizado:new Date().toISOString() });
    }
  }
}

/* rede de segurança: se algo travar, mostra o erro NA TELA (fundo claro)
   em vez de deixar a tela escura vazia — ajuda a diagnosticar no celular */
function mostrarErro(txt){
  var el = document.getElementById('app');
  if(el) el.innerHTML =
    '<div style="background:#fff;color:#a00;padding:18px;border-radius:14px;'
    + 'margin:24px 0;font-size:14px;line-height:1.6">'
    + '<b>Ops! Algo travou ao abrir o StepQuest.</b><br>'
    + 'Tire um print desta tela e mostre para o papai:<br><br>'
    + '<code style="word-break:break-word">' + txt + '</code></div>';
}
window.onerror = function(msg,src,linha){ mostrarErro(msg + ' (linha ' + linha + ')'); };
window.addEventListener('online', function(){ if(estado.syncPend) enviarRanking(); });
try{ sanearMelhores(); if(estado.syncPend) enviarRanking(); render();
     /* Quem já tem perfil salvo sincroniza na abertura: se a criança jogou em
        outro aparelho desde a última vez, o progresso de lá entra aqui sozinho.
        Depois do render, e sem await — a tela nunca espera a rede. */
     if(estado.perfil) sincronizarAluno(); }
catch(e){ mostrarErro((e && e.message) ? e.message : String(e)); }
</script>
