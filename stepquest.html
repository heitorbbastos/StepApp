<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StepQuest — Expedição pelo Tempo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --pt:#E91E63; --mt:#2196F3; --hi:#FF9800; --ge:#4CAF50; --ci:#9C27B0;
    --ouro:#FFC107; --ok:#2e9e5b; --erro:#e0443e;
  }
  html,body{ height:100%; }
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:#15123a;
    background:
      radial-gradient(900px 500px at 12% -8%, #4a2f86 0%, transparent 55%),
      radial-gradient(1000px 600px at 88% 0%, #2b6fb0 0%, transparent 50%),
      linear-gradient(180deg,#1d1748 0%,#140f33 100%);
    background-attachment:fixed;
    color:#fff; min-height:100%;
  }
  #app{ max-width:760px; margin:0 auto; padding:14px 14px 64px; animation:fadein .35s ease; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  h1,h2,h3{ line-height:1.2; }
  button{ font-family:inherit; cursor:pointer; border:none; transition:transform .08s ease, filter .15s; }
  button:active{ transform:scale(.97); }
  .hide{ display:none !important; }

  /* ---- cartão genérico ---- */
  .card{ background:#fff; color:#2a2350; border-radius:20px; padding:16px; margin:12px 0;
    box-shadow:0 10px 28px rgba(10,5,40,.35); border:1px solid rgba(255,255,255,.5); }

  /* ---- guia (personagem) ---- */
  .cronos{ display:flex; gap:12px; align-items:flex-start; margin:6px 0; }
  .cronos .face{ font-size:30px; flex:0 0 auto; width:54px; height:54px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%,#fff,#efe9ff);
    box-shadow:0 4px 12px rgba(80,40,160,.3), inset 0 0 0 3px #fff, inset 0 0 0 5px #d9ccff; }
  .cronos .balao{ background:linear-gradient(180deg,#fffae6,#fff3cf); color:#5b4a00;
    border:2px solid #ffd84d; border-radius:16px; padding:11px 13px; font-size:14.5px;
    position:relative; flex:1; box-shadow:0 3px 10px rgba(150,110,0,.12); }
  .cronos .balao:before{ content:''; position:absolute; left:-9px; top:18px; width:0; height:0;
    border:8px solid transparent; border-right-color:#ffd84d; }
  .cronos .balao b{ color:#a06b00; }

  /* ---- abertura ---- */
  .logo{ text-align:center; padding:18px 0 4px; }
  .logo .big{ font-size:42px; font-weight:800; letter-spacing:.5px;
    background:linear-gradient(90deg,#ffd84d,#ff8fc8,#7ec8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .logo .sub{ color:#c9c2f0; font-size:15px; margin-top:2px; }
  .campo{ width:100%; padding:12px; border-radius:12px; border:2px solid #d8d3f0;
    font-size:16px; color:#2a2350; margin-top:6px; }
  .chars{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0; }
  .char{ background:#f1eefb; border:3px solid transparent; border-radius:14px;
    padding:10px 4px; text-align:center; color:#2a2350; font-size:12px; font-weight:600; }
  .char .e{ font-size:32px; display:block; }
  .char.sel{ border-color:var(--pt); background:#fff; }
  .btn{ display:block; width:100%; padding:14px; border-radius:14px; font-size:17px;
    font-weight:700; color:#fff; background:linear-gradient(90deg,#7b4dff,#b14dff);
    box-shadow:0 6px 16px rgba(120,70,255,.35); }
  .btn:disabled{ opacity:.45; box-shadow:none; }
  .btn.lg{ margin-top:10px; }
  .btn.sec{ background:#ece9f7; color:#5a4fae; box-shadow:none; }

  /* ---- topo / HUD ---- */
  .hud{ display:flex; align-items:center; gap:10px; background:#241f52;
    border:1px solid #423a7e; border-radius:16px; padding:10px 12px; }
  .hud .av{ font-size:24px; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%,#5b4bb0,#37306f); box-shadow:inset 0 0 0 2px #6b5cc8; }
  .hud .who{ flex:1; min-width:0; }
  .hud .who .nm{ font-weight:700; font-size:15px; }
  .hud .who .lv{ font-size:12px; color:#bdb4ee; }
  .xpbar{ height:9px; background:#3a3370; border-radius:6px; overflow:hidden; margin-top:4px; }
  .xpbar i{ display:block; height:100%; background:linear-gradient(90deg,#ffd84d,#ff8fc8); }
  .streak{ background:#3a3370; border-radius:12px; padding:6px 10px; font-weight:700;
    font-size:14px; white-space:nowrap; }

  .titulo{ font-size:20px; margin:16px 4px 4px; }
  .lead{ color:#c9c2f0; font-size:13.5px; margin:0 4px; }

  /* ---- missão do dia ---- */
  .hoje{ background:linear-gradient(120deg,#ffb74d,#ff8a65); color:#3a2200;
    border-radius:18px; padding:14px; margin:12px 0; }
  .hoje .lab{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; opacity:.8; }
  .hoje .ms{ font-size:17px; font-weight:800; margin:2px 0 8px; }
  .hoje button{ background:#3a2200; color:#ffd; padding:9px 14px; border-radius:10px; font-weight:700; }

  /* ---- mapa: territórios ---- */
  .terrs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .terr{ border-radius:20px; padding:15px; color:#fff; position:relative; overflow:hidden;
    min-height:128px; box-shadow:0 8px 20px rgba(0,0,0,.32); }
  .terr:after{ content:''; position:absolute; right:-22px; top:-22px; width:92px; height:92px;
    background:rgba(255,255,255,.12); border-radius:50%; }
  .terr .em{ font-size:32px; width:52px; height:52px; border-radius:14px; position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.22); box-shadow:inset 0 0 0 1px rgba(255,255,255,.3); }
  .terr .nm{ font-weight:800; font-size:18px; margin-top:8px; text-shadow:0 1px 3px rgba(0,0,0,.25); }
  .terr .pg{ font-size:12px; opacity:.95; margin-top:3px; }
  .terr .cd{ display:inline-block; background:rgba(0,0,0,.28); border-radius:8px;
    padding:3px 8px; font-size:11.5px; font-weight:700; margin-top:7px; }
  .terr .lock{ position:absolute; inset:0; background:rgba(20,16,50,.62);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-size:13px; font-weight:700; gap:4px; }
  .terr .lock .bg{ font-size:26px; }
  .terr .med{ position:absolute; top:8px; right:10px; font-size:22px; }
  .progress{ height:7px; background:rgba(0,0,0,.28); border-radius:5px; margin-top:8px; overflow:hidden; }
  .progress i{ display:block; height:100%; background:#fff; }

  /* ---- território: lista de missões ---- */
  .topbar{ display:flex; align-items:center; gap:8px; margin:6px 0 2px; }
  .voltar{ background:#241f52; color:#fff; border:1px solid #423a7e; border-radius:10px;
    padding:8px 12px; font-weight:700; font-size:14px; }
  .miss{ display:flex; align-items:center; gap:12px; }
  .miss .ic{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:24px; flex:0 0 auto; }
  .miss .tx{ flex:1; min-width:0; }
  .miss .tx .t{ font-weight:700; font-size:15.5px; }
  .miss .tx .s{ font-size:12.5px; color:#7d76a8; }
  .miss .go{ font-size:13px; font-weight:800; padding:8px 12px; border-radius:10px;
    color:#fff; }
  .selo{ font-size:20px; }
  .extras{ background:#241f52; border:1px dashed #4b4290; }
  .extras .ex{ display:flex; align-items:center; gap:10px; padding:8px 0; color:#cfc8f2; font-size:14px; }
  .extras .ex .em{ font-size:22px; }
  .embreve{ margin-left:auto; background:#3a3370; color:#cdb6ff; font-size:11px;
    font-weight:700; padding:3px 8px; border-radius:8px; }
  .exhead{ font-weight:700; color:#2a2350; font-size:15px; margin-bottom:8px; }
  .exhead .em{ font-size:20px; }
  .vid{ width:100%; border-radius:12px; background:#000; display:block; }

  /* ---- conteúdo da missão ---- */
  .box{ border-radius:12px; padding:11px 13px; margin:10px 0; font-size:14.5px; line-height:1.5; }
  .box.def{ background:#eef7f0; border-left:5px solid var(--ge); color:#234a30; }
  .box.dica{ background:#fff6e0; border-left:5px solid var(--ouro); color:#6a5200; }
  .box.ex{ background:#e9f2fc; border-left:5px solid var(--mt); color:#1d3c5e; }
  .conteudo p{ font-size:14.5px; line-height:1.55; margin:8px 2px; }
  .conteudo h3{ font-size:16px; margin:14px 2px 4px; }
  .conteudo ul{ margin:6px 0 6px 22px; font-size:14.5px; line-height:1.5; }
  .tab{ width:100%; border-collapse:collapse; margin:10px 0; font-size:13.5px; }
  .tab th,.tab td{ border:1px solid #ddd8f0; padding:6px 8px; text-align:left; }
  .tab th{ background:#f1eefb; }
  mark{ background:#fff1a8; padding:0 3px; border-radius:3px; }

  /* ---- quiz ---- */
  .qn{ font-weight:700; font-size:15.5px; margin:4px 2px 8px; }
  .qprog{ font-size:12px; color:#7d76a8; font-weight:700; }
  .opt{ display:block; width:100%; text-align:left; background:#f3f1fb; color:#2a2350;
    border:2px solid #e3def5; border-radius:12px; padding:12px; font-size:14.5px;
    margin:8px 0; }
  .opt.sel{ border-color:#7b4dff; background:#fff; }
  .opt.certa{ border-color:var(--ok); background:#e7f6ec; }
  .opt.errada{ border-color:var(--erro); background:#fbe9e8; }
  .feed{ font-size:13.5px; border-radius:10px; padding:10px; margin-top:6px; }
  .feed.bom{ background:#e7f6ec; color:#1d6b3a; }
  .feed.ruim{ background:#fbe9e8; color:#9a2a26; }
  .seqfogo{ background:linear-gradient(90deg,#fff3c4,#ffe0b3); color:#9a5b00;
    font-weight:800; font-size:13px; border-radius:10px; padding:8px 10px;
    margin-top:6px; text-align:center; animation:pop .4s ease; }

  /* ---- vida/movimento (transições de tela e micro-interações) ---- */
  @keyframes telain{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
  @keyframes cardin{ from{ opacity:0; transform:translateY(18px) scale(.96);} to{ opacity:1; transform:none;} }
  @keyframes facein{ from{ transform:scale(0) rotate(-12deg);} to{ transform:scale(1) rotate(0);} }
  @keyframes balaoin{ from{ opacity:0; transform:translateX(-8px);} to{ opacity:1; transform:none;} }
  @keyframes encher{ from{ width:0; } }
  @keyframes pulsar{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.04);} }
  #app.telain{ animation: telain .3s ease both; }
  #app.telain .terr{ animation: cardin .42s ease both; }
  #app.telain .terr:nth-child(1){ animation-delay:.03s } #app.telain .terr:nth-child(2){ animation-delay:.08s }
  #app.telain .terr:nth-child(3){ animation-delay:.13s } #app.telain .terr:nth-child(4){ animation-delay:.18s }
  #app.telain .terr:nth-child(5){ animation-delay:.23s } #app.telain .terr:nth-child(6){ animation-delay:.28s }
  #app.telain .terr:nth-child(7){ animation-delay:.33s } #app.telain .terr:nth-child(8){ animation-delay:.38s }
  #app.telain .aluno{ animation: cardin .3s ease both; }
  #app.telain .progress i{ animation: encher .8s ease both; }
  .cronos .face{ animation: facein .45s cubic-bezier(.34,1.56,.64,1) both; }
  .cronos .balao{ animation: balaoin .32s ease .1s both; }
  .feed.bom{ animation: pop .35s ease; }
  .feed.ruim{ animation: shake .4s ease; }
  .hoje button{ animation: pulsar 1.9s ease-in-out infinite; }
  .terr .med{ animation: pop .5s ease both; }
  .btn:active, .terr:active, .aluno:active, .opt:active{ transform:scale(.96); transition:transform .08s; }
  .confete{ position:fixed; inset:0; pointer-events:none; z-index:99; }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none!important; transition:none!important; } }

  /* ---- resultado ---- */
  .res{ text-align:center; }
  .res .big{ font-size:54px; }
  .res .nota{ font-size:30px; font-weight:800; margin:4px 0; }
  .res .xp{ display:inline-block; background:#fff3c4; color:#7a5b00; font-weight:800;
    padding:6px 14px; border-radius:12px; margin-top:4px; }
  @keyframes pop{ 0%{ transform:scale(.4); } 70%{ transform:scale(1.15);} 100%{ transform:scale(1);} }
  .pop{ display:inline-block; animation:pop .5s ease; }

  .rodape{ text-align:center; color:#6b6498; font-size:11px; margin-top:24px; }
  .rodape a{ color:#9a90d6; cursor:pointer; }

  /* ---- identificação (lista da turma) ---- */
  .alunos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:9px; margin-top:12px; }
  .aluno{ padding:12px 6px; border:2px solid #ffe08a; border-radius:14px;
    background:linear-gradient(180deg,#fffdf5,#fff4d6); color:#6a5410; font-weight:700;
    font-size:14px; box-shadow:0 3px 8px rgba(150,110,0,.1); }
  .aluno:active{ background:#fff; border-color:#ffb84d; }

  /* ---- welcome ---- */
  .welcome{ text-align:center; padding:16px; background:linear-gradient(135deg,#ffffff,#f3efff); }
  .welcome b{ color:#6a3fd0; }

  /* ---- ler-junto: linha sendo lida ---- */
  .conteudo .lnr{ padding:5px 9px; margin:2px 0; border-radius:9px;
    transition:background .2s ease, transform .2s ease; }
  .lnr.lendo{ background:linear-gradient(90deg,#fff1a8,#ffe27a); font-weight:700;
    box-shadow:0 2px 8px rgba(220,170,0,.25); transform:scale(1.012); }

  /* ---- resumão de referência ---- */
  .resumao{ background:#f5f3fc; border-radius:12px; padding:2px 12px; margin:10px 0; }
  .resumao summary{ cursor:pointer; font-weight:700; color:#5a4fae; padding:9px 0; font-size:14px; list-style:none; }
  .resumao summary::-webkit-details-marker{ display:none; }
  .resumao summary:before{ content:'▸ '; }
  .resumao[open] summary:before{ content:'▾ '; }
  .resumao-c{ font-size:13.5px; line-height:1.55; padding:0 0 10px; color:#3a3360; }

  /* ---- joguinho de classificar ---- */
  .jbins{ display:flex; gap:8px; margin-bottom:14px; }
  .jbin{ flex:1; padding:14px 6px; border-radius:14px; background:linear-gradient(180deg,#efeafd,#e2d9fb);
    color:#4a3f9e; font-weight:800; font-size:13px; border:2px solid #cdbff5; }
  .jbin:active{ background:#fff; }
  .jpool{ display:flex; flex-wrap:wrap; gap:8px; }
  .jitem{ padding:11px 13px; border-radius:12px; background:#f5f3fc; color:#2a2350;
    border:2px solid #e3def5; font-size:14px; font-weight:600; }
  .jitem.sel{ border-color:#7b4dff; background:#fff; box-shadow:0 0 0 3px rgba(123,77,255,.2); }
  .jitem.err{ border-color:var(--erro); background:#fbe9e8; animation:shake .3s; }
  .jitem.feito{ background:#e7f6ec; color:#1d6b3a; border:2px solid #b6e3c5; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

  /* ---- ranking ---- */
  .rkrow{ display:flex; align-items:center; gap:12px; padding:11px 8px; border-bottom:1px solid #eee; }
  .rkfb{ background:linear-gradient(135deg,#fff6da,#ffe7a8); color:#7a5b00; border-radius:14px;
    padding:11px 13px; font-weight:700; font-size:14px; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   StepQuest — app de estudos da Mariana (2º Simulado)
   Arquitetura: MOTOR (genérico) + CONTEÚDO (dados por matéria).
   Para adicionar uma matéria, basta preencher CONTEUDO[id].
   ============================================================ */

/* ---------- datas das provas (3º Simulado — 08 a 11/set/2026) ---------- */
const PROVAS = {

/* ---------- CONTEÚDO (transposto do Roblox — não editar à mão) ---------- */

        "resumo": "CARTA DE RECLAMAÇÃO = pra reclamar de algo que te incomodou, pedindo solução.<br>Partes:<br>• Local e data (Belém, 27 de maio de 2026)<br>• Saudação (Prezado Senhor / Caro responsável)<br>• Corpo: 1) o PROBLEMA 2) sua OPINIÃO + ARGUMENTOS 3) o que você PEDE<br>• Despedida educada (Atenciosamente)<br>• Assinatura<br>TOM: respeitoso e claro — nada de xingar! Educação ABRE portas.",

            "op": [

            ],
            "correta": 0,

          },

/* fim INTERJ_TXT */
function nInterj(mat,k){
  /* Sorteia só entre os índices que TÊM MP3. Texto e áudio andam casados (quiz.fbv
     trava os dois no mesmo sorteio, pro balão mostrar o que o professor fala), então
     prometer 24 frases tendo 6 áudios deixaria o professor mudo em 3 de cada 4
     reações — pior que a repetição que a turma reclamou. INTERJ_AUDIO é injetado por
     scripts/injetar_interj.py contando os arquivos que existem de verdade em
     narracao/_quiz/_int; quando os MP3 novos forem gerados, basta rodar o injetor de
     novo e o pool cresce sozinho. */
  var t=(typeof INTERJ_TXT!=='undefined')&&INTERJ_TXT;
  return (t&&t[mat]&&t[mat][k])?t[mat][k].length:NVAR[k];
}
function sorteiaInterj(mat,k){
  /* Escolhe um índice que TENHA mp3. INTERJ_AUDIO é a lista dos que existem (não uma
     contagem): assim dá pra apagar um áudio dessincronizado no meio — foi o caso de
     portugues-no-4, cujo texto mudou ao neutralizar o "querida" — sem derrubar os
     índices seguintes. Sem a lista, cai no sorteio antigo sobre o texto. */
  var a=(typeof INTERJ_AUDIO!=='undefined')&&INTERJ_AUDIO;
  var l=a&&a[mat]&&a[mat][k];
  if(l&&l.length) return l[(Math.random()*l.length)|0];
  return rvar(nInterj(mat,k));
}
function interjTexto(mat,k,v){
  var t=(typeof INTERJ_TXT!=='undefined')&&INTERJ_TXT;
  return (t&&t[mat]&&t[mat][k])?t[mat][k][v-1]:null;
}

/* ---- ranking da turma (Supabase) — nunca perde ponto: marca pendência e re-tenta ---- */
async function enviarRanking(){
  if(!estado.perfil || !estado.id) return false;
  var linha = { id:estado.id, nome:estado.perfil.nome,
                pontos:totalXP(), atualizado:new Date().toISOString() };
  var cab = { 'apikey':SUPA_KEY, 'Authorization':'Bearer '+SUPA_KEY,
              'Content-Type':'application/json' };
  var ok = false;
  try{
    var r = await fetch(SUPA_URL+'/rest/v1/ranking?on_conflict=id', {
      method:'POST',
      headers:Object.assign({ 'Prefer':'resolution=merge-duplicates' }, cab),
      body: JSON.stringify([linha])
    });
    ok = r.ok;
    if(!ok){
      // upsert recusado (ex.: política de UPDATE) — tenta atualizar a linha direto
      var p = await fetch(SUPA_URL+'/rest/v1/ranking?id=eq.'+encodeURIComponent(estado.id), {
        method:'PATCH', headers:cab,
        body: JSON.stringify({ nome:linha.nome, pontos:linha.pontos, atualizado:linha.atualizado })
      });
      ok = p.ok;
    }
  }catch(e){ ok = false; }
  if(estado.syncPend !== !ok){ estado.syncPend = !ok; salvar(); }
  return ok;
}
async function carregarRanking(){
  try{
    const r = await fetch(SUPA_URL+'/rest/v1/ranking?select=id,nome,pontos&order=pontos.desc,atualizado.asc&limit=50',
      { headers:{ 'apikey':SUPA_KEY } });
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}

/* ---- progressão ---- */
/* limpa chaves órfãs (conteúdo que mudou) e teta cada nota no máximo da
   missão atual — garante que o XP nunca passa do possível */
function sanearMelhores(){
  var lim = {};
  for(var tid in CONTEUDO){
    CONTEUDO[tid].missoes.forEach(function(ms){ lim[ms.id]=(ms.quiz||[]).length; });
  }
  /* Os bônus existem para MAIS matérias do que os deveres: CONTEUDO tem 5
     (português, matemática, história, geografia, ciências), mas PROVAFINAL e JOGOS
     têm 8 — as 5 mais artes, ed. física e inglês — e há podcast para as 8.
     Montar `lim` dentro do laço de CONTEUDO deixava prova-/jogo-/pod- dessas três
     matérias FORA da lista de chaves válidas, e o passo seguinte as apagava como
     órfãs. Como sanearMelhores() roda a cada abertura do app e salva, eram 675 XP
     (3 x 225) que a criança ganhava e o app apagava — refazer não adiantava, o
     máximo era inalcançável. Por isso o universo de matérias é a UNIÃO das três
     fontes, nunca só a dos deveres. */
  var materias = {};
  for(var a in CONTEUDO) materias[a]=1;
  if(typeof PROVAFINAL!=='undefined') for(var b in PROVAFINAL) materias[b]=1;
  if(typeof JOGOS!=='undefined')      for(var c in JOGOS)      materias[c]=1;
  for(var mid in materias){
    if(typeof PROVAFINAL!=='undefined' && PROVAFINAL[mid]) lim['prova-'+mid]=4;
    if(typeof JOGOS!=='undefined' && JOGOS[mid]) lim['jogo-'+mid]=3;
    lim['pod-'+mid]=2;
  }
  var mudou=false;
  for(var k in estado.melhores){
    if(lim[k]==null){ delete estado.melhores[k]; mudou=true; }
    else if(estado.melhores[k]>lim[k]){ estado.melhores[k]=lim[k]; mudou=true; }
  }
  if(mudou) salvar();
}
function totalXP(){ let x=0; for(const k in estado.melhores) x += estado.melhores[k]*25; return x; }
function nivel(){ return Math.floor(totalXP()/100)+1; }
function xpNoNivel(){ return totalXP()%100; }
function missoesDe(id){ return CONTEUDO[id] ? CONTEUDO[id].missoes : []; }
function feita(mid){ return estado.melhores[mid]!=null; }
function territorioCompleto(id){
  const ms = missoesDe(id); return ms.length>0 && ms.every(m=>feita(m.id));
}
function territorioOuro(id){
  const ms = missoesDe(id); return ms.length>0 && ms.every(m=>estado.melhores[m.id]===4);
}

/* ---- streak ---- */
function diaAnterior(iso){
  const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function registrarDia(){
  if(estado.ultimoDia===HOJE) return;
  if(estado.ultimoDia===diaAnterior(HOJE)) estado.streak++;
  else estado.streak = 1;
  estado.ultimoDia = HOJE;
}

/* ---- contagem regressiva ---- */
/* Derivado de PROVAS, e de propósito FORA do bloco que o gerar_webapp.py substitui
   (ele troca tudo entre "datas das provas" e "const MIDIA = {}"). Em 30/08/2026 isto
   era uma const dentro daquele bloco: sobreviveu no motor e SUMIU no app gerado, que
   quebrou no iPhone com "Can't find variable: PRIMEIRA_PROVA" assim que o fraseMapa()
   rodava. Derivar em vez de repetir faz o valor existir nos dois arquivos sempre — e
   acompanha sozinho qualquer mudança no cronograma. */
const PRIMEIRA_PROVA = Object.values(PROVAS).filter(Boolean).sort()[0];
function diasAte(iso){
  const a=new Date(HOJE+'T12:00:00'), b=new Date(iso+'T12:00:00');
  return Math.round((b-a)/86400000);
}
function textoContagem(id){
  /* Nem toda matéria cai no simulado — no 3º (08 a 11/09) Artes e Ed. Física ficam de
     fora. Antes o gerador dava uma data a todas e o card anunciava "prova em X dias"
     para matéria que não tem prova. PROVAS[id] nulo = território de exploração. */
  if(!PROVAS[id]) return '✨ não cai no simulado';
  const d = diasAte(PROVAS[id]);
  if(d<0) return 'prova já passou';
  if(d===0) return '📣 prova é HOJE!';
  if(d===1) return '📣 prova é AMANHÃ!';
  return '🗓️ prova em '+d+' dias';
}

function missaoDoDia(){
  for(const t of TERRITORIOS){
    for(const m of missoesDe(t.id)){

  for(const t of TERRITORIOS){
    const ms = missoesDe(t.id);
    if(ms.length){ return {terr:t, miss:ms[0], revisao:true}; }
  }
  return null;
}

/* ---- festa: confete leve em canvas (recorde, 100%, prova, joguinho) ---- */
function confete(qtd){
  try{
    var cv=document.createElement('canvas'); cv.className='confete';
    cv.width=window.innerWidth; cv.height=window.innerHeight;
    document.body.appendChild(cv);
    var cx=cv.getContext('2d');
    var cores=['#FFC857','#FF6B6B','#4ECDC4','#9B5DE5','#43AA8B','#F94892','#3A86FF'];
    var pcs=[]; for(var i=0;i<(qtd||90);i++) pcs.push({
      x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.4,
      r:4+Math.random()*5, c:cores[(Math.random()*cores.length)|0],
      v:2.2+Math.random()*3, a:Math.random()*Math.PI, va:(Math.random()-.5)*.25 });
    var t0=null;
    (function passo(ts){
      if(t0===null && ts!==undefined) t0=ts;
      cx.clearRect(0,0,cv.width,cv.height);
      pcs.forEach(function(p){ p.y+=p.v; p.x+=Math.sin((p.y+p.a*60)/28)*1.6; p.a+=p.va;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a);
        cx.fillStyle=p.c; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); });
      if(ts===undefined || ts-t0<2400) requestAnimationFrame(passo); else cv.remove();
    })();
  }catch(e){}
}
/* número que sobe rolando (XP no resultado) */
function animarNumero(id, alvo, ms){
  var el=document.getElementById(id); if(!el) return;
  var t0=null;
  (function p(ts){ if(t0===null && ts!==undefined) t0=ts;
    var k = ts===undefined ? 0 : Math.min(1,(ts-t0)/(ms||700));
    el.textContent = Math.round(alvo*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(p);
  })();
}

  // escurece a cor para o gradiente

  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}

function pararNarracao(){
  if(narrAudio){ narrAudio.ontimeupdate=null; narrAudio.onended=null; narrAudio.pause(); narrAudio=null; }
  document.querySelectorAll('.lnr').forEach(function(s){ s.classList.remove('lendo'); });
  var b=document.getElementById('btnLer'); if(b) b.textContent='🔊 Cronos lê pra mim';
}
function toggleLerAuto(){ estado.lerAuto=!estado.lerAuto; salvar(); pararNarracao(); render(); }
function lerJunto(mid){
  var btn=document.getElementById('btnLer');
  if(narrAudio){ pararNarracao(); return; }
  btn.textContent='⏳ carregando a voz do Cronos...';
  fetch(URL_NARR+mid+'.json'+AUDV).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d){ btn.textContent='🔇 narração em breve'; return; }
    narrTimes=d.linhas;
    narrAudio=new Audio(URL_NARR+mid+'.mp3'+AUDV);
    narrAudio.ontimeupdate=function(){
      if(!narrAudio) return;
      var ct=narrAudio.currentTime, idx=0, i;
      for(i=0;i<narrTimes.length;i++){ if(narrTimes[i].t<=ct) idx=i; }
      document.querySelectorAll('.lnr').forEach(function(s,j){
        var on=(j===idx); s.classList.toggle('lendo', on);
        if(on) s.scrollIntoView({block:'center',behavior:'smooth'});
      });
    };
    narrAudio.onended=function(){ pararNarracao(); };
    var p=narrAudio.play();
    if(p && p.then){ p.then(function(){ btn.textContent='⏸ Pausar leitura'; })
                      .catch(function(){ narrAudio=null; btn.textContent='🔊 Cronos lê pra mim'; }); }
    else btn.textContent='⏸ Pausar leitura';
  }).catch(function(){ btn.textContent='🔇 narração indisponível agora'; });
}

/* ---- quiz ---- */
function iniciarQuiz(tid,mid){
  const m = missoesDe(tid).find(x=>x.id===mid);
  // embaralha a ordem das opções de cada questão
  const ordem = m.quiz.map(q=>{
    const idx = q.op.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [idx[i],idx[j]]=[idx[j],idx[i]]; }
    return idx;
  });
  quiz = { tid, mid, q:0, ordem, resp:{}, enviado:false };
  view = { tela:'quiz', terr:tid, miss:mid };
  ultimoQuizLido=null;
  render();
}
function iniciarProva(mat){
  var g=PROVAFINAL[mat]; if(!g) return;
  var pares=g.pares.map(function(p,idx){ return {a:p.a,b:p.b,idx:idx,feito:false}; });
  var dir=pares.map(function(p){return p.idx;});
  for(var i=dir.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=dir[i]; dir[i]=dir[j]; dir[j]=t; }
  provaEstado={mat:mat,pares:pares,dir:dir,selA:null,erro:null,completo:false};
  pararSolto(); view={tela:'prova',terr:mat}; render();
  try{ introAudio=new Audio(URL_NARR+'_provaintro/'+mat+'.mp3'); introAudio.play().catch(function(){}); }catch(e){}
}
function provaSelA(i){ if(provaEstado.pares[i].feito) return; provaEstado.selA=(provaEstado.selA===i?null:i); provaEstado.erro=null; render(); }
function provaMatch(bidx){
  if(provaEstado.selA==null) return;
  if(provaEstado.selA===bidx){
    provaEstado.pares[bidx].feito=true; provaEstado.selA=null; provaEstado.erro=null;
    if(provaEstado.pares.every(function(x){return x.feito;})){
      var k='prova-'+provaEstado.mat; provaEstado.bonus=!estado.melhores[k];
      if(provaEstado.bonus){ estado.melhores[k]=4; salvar(); enviarRanking(); }
      provaEstado.completo=true; render();
      setTimeout(function(){ confete(provaEstado.bonus?130:60); }, 200);
      tocarSeq([URL_NARR+'_res/'+provaEstado.mat+'-'+rvar(NVAR.res)+'.mp3']);
    } else { render(); tocarSeq([URL_NARR+'_quiz/_int/'+provaEstado.mat+'-ok-'+sorteiaInterj(provaEstado.mat,'ok')+'.mp3'+AUDV]); }
  } else { provaEstado.erro=bidx; provaEstado.selA=null; render(); tocarSeq([URL_NARR+'_quiz/_int/'+provaEstado.mat+'-no-'+sorteiaInterj(provaEstado.mat,'no')+'.mp3'+AUDV]); }
}
function telaProva(){

function qzQs(){ return missoesDe(quiz.tid).find(function(x){return x.id===quiz.mid;}).quiz; }
function telaQuiz(){
  const t = TERRITORIOS.find(x=>x.id===quiz.tid);
  const qs = qzQs();
  const i = quiz.q;
  const questao = qs[i];
  const ordem = quiz.ordem[i];
  const escolhida = quiz.resp[i];          // índice REAL (na ordem embaralhada)
  const opts = ordem.map((realIdx,pos)=>{
    let cls='opt';
    if(quiz.enviado){
      if(realIdx===questao.correta) cls+=' certa';
      else if(pos===escolhida) cls+=' errada';
    } else if(pos===escolhida) cls+=' sel';
    return `<button class="${cls}" ${quiz.enviado?'disabled':''}
      onclick="marcar(${pos})">${questao.op[realIdx]}</button>`;
  }).join('');

  let feed='', botoes='';
  if(quiz.enviado){
    const acertou = ordem[escolhida]===questao.correta;
    const fbTxt = interjTexto(quiz.tid, acertou?'ok':'no', quiz.fbv||1);
    const seqExtra = (acertou && quiz.seq>=3)
      ? `<div class="seqfogo">${pick(['🔥','⚡','🌟'])} ${quiz.seq} seguidas! ${pick(['Tá pegando fogo!','Imparável!','Que sequência!','Continua assim!'])}</div>` : '';
    feed = `<div class="feed ${acertou?'bom':'ruim'}">
      ${acertou?'✅ ':'❌ '}${fbTxt?fbTxt+'<br>':(acertou?'Isso aí! ':'Quase! ')}${questao.explica}</div>${seqExtra}`;
    botoes = i < qs.length-1
      ? `<button class="btn lg" onclick="proxima()">Próxima →</button>`
      : `<button class="btn lg" onclick="finalizarQuiz()">Ver resultado 🏁</button>`;
  } else {
    botoes = `<button class="btn lg" id="conf" disabled onclick="confirmar()">Confirmar</button>`;
  }

  app.innerHTML = `
    ${hud()}
    <div class="topbar">
      <button class="voltar" onclick="${quiz.prova?`irTerritorio('${t.id}')`:`irMissao('${t.id}','${quiz.mid}')`}">← Sair</button>
      <div class="qprog">${quiz.prova?'🏆 Prova · ':''}Pergunta ${i+1} de ${qs.length}</div>
    </div>
    <div class="card">
      <div class="qn">${questao.p}</div>
      <button class="btn sec" style="max-width:300px;margin:6px auto 12px" onclick="vozQuizEnunciado()">🔊 Ouvir de novo</button>
      ${opts}
      ${feed}
      ${botoes}
    </div>`;
  var chaveQ = quiz.mid+'-'+i+'-'+(quiz.enviado?'e':'p');
  if(chaveQ!==ultimoQuizLido){ ultimoQuizLido=chaveQ;
    if(!quiz.enviado) vozQuizEnunciado();
    else vozQuizFeedback(ordem[escolhida]===questao.correta);
  }
  if(escolhida!=null && !quiz.enviado){
    const c=document.getElementById('conf'); if(c) c.disabled=false;
  }
}
function marcar(pos){
  if(quiz.enviado) return;
  quiz.resp[quiz.q]=pos; render();
}
function confirmar(){
  if(quiz.resp[quiz.q]==null) return;
  var q=qzQs()[quiz.q];
  var ok = quiz.ordem[quiz.q][quiz.resp[quiz.q]]===q.correta;
  quiz.seq = ok ? (quiz.seq||0)+1 : 0;          // acertos seguidos na missão
  quiz.fbv = sorteiaInterj(quiz.tid, ok?'ok':'no');  // trava texto+áudio no mesmo sorteio
  quiz.enviado=true; render();
}
function proxima(){ quiz.q++; quiz.enviado=false; render(); }
function finalizarQuiz(){
  const qs = qzQs();
  let acertos=0;
  qs.forEach((q,i)=>{ if(quiz.ordem[i][quiz.resp[i]]===q.correta) acertos++; });
  const chave = quiz.prova ? ('prova-'+quiz.tid) : quiz.mid;
  const antes = estado.melhores[chave] || 0;
  if(acertos>antes) estado.melhores[chave]=acertos;
  else if(estado.melhores[chave]==null) estado.melhores[chave]=acertos;
  registrarDia();
  salvar();
  enviarRanking();
  view.tela='resultado';
  view._ult = { acertos, total:qs.length, novoRecorde:acertos>antes, prova:quiz.prova };
  render();
}

    : d===1 ? 'É <b>amanhã</b>! Matemática e Ciências abrem. Última revisão e bora! 🔥'
    : d<=7 ? 'Falta <b>'+d+' dia'+(d>1?'s':'')+'</b> pro 3º simulado (8 a 11/9). Reta final — capricha! 🔥'
    : 'O segundo semestre começou e o <b>3º simulado</b> vem aí: <b>8 a 11 de setembro</b>. '
      +'Faltam <b>'+d+' dias</b> — cada missão te deixa mais forte! 🌟';

function conectorTexto(t, pi){
  var c = CONECTORES[t.id];
  var nome = estado.perfil ? estado.perfil.nome : 'exploradora';
  if(!c) return 'Mandou bem, '+nome+'! Bora pra próxima! 🚀';
  var ms = missoesDe(t.id);
  var feitas = ms.filter(function(x){return feita(x.id);}).length, total = ms.length;
  var prox = ms.filter(function(x){return !feita(x.id);})[0];
  // pi (quando dado) força qual "parabens" aparece — pra o áudio de resultado
  // (_res/<mat>-<pi+1>.mp3, gerado na MESMA ordem) ler EXATAMENTE este balão.
  var elogio = (pi!=null && c.parabens[pi]!=null) ? c.parabens[pi] : pick(c.parabens);
  var partes = (feitas>=total) ? [pick(c.completa)]
             : [elogio, pick(c.progresso)].concat(prox?[pick(c.proxima)]:[]);
  return partes.filter(Boolean).join(' ')
    .replace(/\{nome\}/g, nome).replace(/\{feitas\}/g, feitas).replace(/\{total\}/g, total)
    .replace(/\{materia\}/g, t.nome).replace(/\{prox\}/g, prox?prox.titulo:'');
}

/* ---- feedback de ranking (subiu posições / pódio) — bem variado ---- */
async function rankingFeedback(){
  var lista = await carregarRanking(); if(!lista || !lista.length) return '';
  var pos = 0, i;
  for(i=0;i<lista.length;i++){ if(lista[i].id===estado.id){ pos=i+1; break; } }
  if(!pos) return '';
  var nome = estado.perfil.nome;
  var ant = estado.ultPos||0; estado.ultPos = pos; salvar();
  var rotulo = pos<=3 ? ['🥇 1º','🥈 2º','🥉 3º'][pos-1] : pos+'º';
  if(ant && pos<ant){
    var d=ant-pos, pl=d>1?'posições':'posição';
    return pick([
      '🚀 UAU, '+nome+'! Você subiu '+d+' '+pl+' e já é '+rotulo+' na turma!',
      '📈 Foguete ligado, '+nome+'! Mais '+d+' '+pl+' — agora você é '+rotulo+'!',
      '⚡ Que escalada! '+nome+', você pulou '+d+' '+pl+' e está em '+rotulo+'!',
      '🔥 Subindo no placar, '+nome+'! '+rotulo+' lugar agora!',
      '🏃 Disparou, '+nome+'! '+d+' '+pl+' pra cima — '+rotulo+' da turma!']);
  }
  if(pos<=3) return pick([
    '🏆 '+nome+', você está no PÓDIO: '+rotulo+' da turma! Que orgulho!',
    '👑 Top da turma! '+nome+', você é '+rotulo+'. Arrasou!',
    '⭐ '+rotulo+' lugar, '+nome+'! Você está voando no placar!']);
  if(!ant) return pick([
    '🎉 '+nome+', você entrou no placar em '+pos+'º! A escalada começou!',
    '📋 Bem-vinda ao placar, '+nome+'! Você está em '+pos+'º. Bora subir!']);
  return pick([
    '💪 Firme em '+pos+'º, '+nome+'! Mais uma missão e você sobe!',
    '😎 '+pos+'º lugar, '+nome+'. O pódio tá logo ali!',
    '🌟 '+nome+', você segue em '+pos+'º. A turma tá de olho!',
    '🧭 Posição '+pos+'º, '+nome+'! Cada acerto te leva mais alto!']);
}

  for(var i=itens.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,tmp=itens[i];itens[i]=itens[j];itens[j]=tmp;}

    app.innerHTML=`${hud()}
      <div class="card res">
        <div class="big pop">🎮🏆</div>
        <div class="nota">Você classificou tudo certo!</div>
        ${jogoEstado.bonus?'<div class="xp">+75 XP de bônus! ⚡</div>':'<div class="xp" style="background:#eee;color:#777">joguinho já dominado</div>'}
        <button class="btn lg" onclick="irJogo('${jogoEstado.mat}')">Jogar de novo 🔁</button>
        <button class="btn lg sec" onclick="irTerritorio('${jogoEstado.mat}')">Voltar para ${t.nome}</button>
      </div>`;
    return;
  }
  var bins=g.categorias.map(function(c){ return '<button class="jbin" onclick="jogoBin(\''+c.id+'\')">'+c.label+'</button>'; }).join('');
  var pool=jogoEstado.itens.map(function(it,i){
    if(it.feito) return '<div class="jitem feito">✓ '+it.txt+'</div>';
    var cls='jitem'+(jogoEstado.sel===i?' sel':'')+(jogoEstado.erro===i?' err':'');
    return '<button class="'+cls+'" onclick="jogoSel('+i+')">'+it.txt+'</button>';
  }).join('');
  var faltam=jogoEstado.itens.filter(function(x){return !x.feito;}).length;
  app.innerHTML=`${hud()}
    <div class="topbar"><button class="voltar" onclick="irTerritorio('${jogoEstado.mat}')">← ${t.nome}</button>
      <div class="qprog">faltam ${faltam}</div></div>
    <div class="titulo" style="margin-top:6px">🎮 ${g.titulo}</div>
    <div class="card">
      <div class="lead" style="color:#5a4fae;margin-bottom:12px">${g.instrucao}</div>
      <div class="jbins">${bins}</div>
      <div class="jpool">${pool}</div>
      <div style="font-size:12px;color:#888;text-align:center;margin-top:10px">Toque numa carta e depois na caixa certa.</div>
    </div>`;
}

/* ---- ranking ---- */
function telaRanking(){
  app.innerHTML = `
    ${hud()}
    <div class="topbar">
      <button class="voltar" onclick="irMapa()">← Mapa</button>
      <div class="titulo" style="margin:0">🏆 Placar da Turma</div>
    </div>
    <div class="lead">Quem mais explorou o tempo! O placar soma TODO o XP: missões,
      prova final (+100), joguinho (+75) e podcast (+50) de cada matéria.</div>
    ${estado.syncPend?'<div class="card" style="background:#fff8e6;border:1px solid #f0d48a;font-size:13.5px">⏳ Seus pontos mais novos ainda não subiram pro placar (sem internet na hora). Eles sobem sozinhos assim que conectar!</div>':''}
    <div id="rklist" class="card">Carregando o placar…</div>
    <div class="rodape">Dica: faça missões e bata seus recordes pra subir! 🌟</div>`;
  enviarRanking().then(carregarRanking).then(function(lista){
    var el=document.getElementById('rklist'); if(!el) return;
    if(lista===null){ el.innerHTML='Não consegui carregar o placar agora. Confira a internet e tente de novo. 🌀'; return; }
    if(!lista.length){ el.innerHTML='Ainda não tem ninguém no placar. Seja a primeira a aparecer! 🚀'; return; }
    el.innerHTML = lista.map(function(r,i){
      var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'º';
      var eu = (r.id===estado.id);
      var estilo = 'display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid #eee;'
        + (eu?'background:#fff3cd;font-weight:800;border-radius:8px;':'');
      return '<div style="'+estilo+'">'
        + '<span style="min-width:34px;text-align:center;font-size:18px">'+medal+'</span>'
        + '<span style="flex:1">'+r.nome+(eu?' (você)':'')+'</span>'
        + '<span style="color:#a06b00;font-weight:700">'+r.pontos+' XP</span></div>';
    }).join('');
  });
}

/* ---- navegação ---- */
let introAudio=null, falaAudio=null, quizAudio=null, ultimoQuizLido=null, podAudio=null;
function tocarPodcast(mat){
  var st=document.getElementById('podst');
  try{ if(podAudio) podAudio.pause();
    podAudio=new Audio(URL_NARR+'_podcast/'+mat+'.mp3');
    if(st) st.textContent='tocando… 🎧';
    podAudio.onended=function(){ var k='pod-'+mat; if(!estado.melhores[k]){ estado.melhores[k]=2; salvar(); enviarRanking(); } if(view.tela==='territorio') render(); };
    var p=podAudio.play(); if(p&&p.catch) p.catch(function(){ if(st) st.textContent='toque pra ouvir'; });
  }catch(e){}
}
function ouvirFala(fc){ try{ if(falaAudio) falaAudio.pause(); falaAudio=new Audio(URL_NARR+'_fala/'+fc+'.mp3'+AUDV); falaAudio.play().catch(function(){}); }catch(e){} }
function pararQuizAudio(){ if(quizAudio){ quizAudio.onended=null; quizAudio.pause(); quizAudio=null; } }
function tocarSeq(urls){ pararQuizAudio(); var k=0; (function next(){ if(k>=urls.length) return; quizAudio=new Audio(urls[k++]); quizAudio.onended=next; quizAudio.onerror=next; var p=quizAudio.play(); if(p&&p.catch) p.catch(function(){}); })(); }
function vozQuizEnunciado(){ var q=qzQs()[quiz.q]; var base=q.vc||(quiz.mid+'-'+quiz.q); var u=[URL_NARR+'_quiz/'+base+'-p.mp3'+AUDV]; if(q.af&&q.fc) u.push(URL_NARR+'_fala/'+q.fc+'.mp3'+AUDV); tocarSeq(u); }
function vozQuizFeedback(ok){ var q=qzQs()[quiz.q]; var base=q.vc||(quiz.mid+'-'+quiz.q); var k=ok?'ok':'no'; var v=quiz.fbv||sorteiaInterj(quiz.tid,k); tocarSeq([URL_NARR+'_quiz/_int/'+quiz.tid+'-'+k+'-'+v+'.mp3'+AUDV, URL_NARR+'_quiz/'+base+'-x.mp3'+AUDV]); }
function pararSolto(){ try{ if(introAudio){introAudio.pause();introAudio=null;} if(audioNome){audioNome.pause();} if(falaAudio){falaAudio.pause();} pararQuizAudio(); if(podAudio){podAudio.pause();} }catch(e){} }
function tocarIntroMateria(id){
  var nm=slugNome(estado.perfil?estado.perfil.nome:'');
  try{
    introAudio=new Audio(URL_NARR+'_saud/'+id+'-'+nm+'.mp3');
    introAudio.onerror=function(){ var p=PERSONAS[id]; if(p&&p.intro){ introAudio=new Audio(URL_NARR+'_elenco/'+p.intro+'.mp3'); introAudio.play().catch(function(){}); } };
    introAudio.play().catch(function(){});
  }catch(e){}
}
function introMateriaTexto(t){
  var p=PERSONAS[t.id]||{}; var nome=estado.perfil?estado.perfil.nome:'exploradora';
  return 'Olá, '+nome+'! Eu sou <b>'+(p.nome||'seu guia')+'</b>. Bora estudar <b>'+t.nome+'</b>? Escolha uma missão aqui embaixo — a prova tá chegando! 🚀';
}
function irMapa(){ pararSolto(); pararNarracao(); view={tela:'mapa'}; render(); if(estado.syncPend) enviarRanking(); }
function irRanking(){ pararSolto(); view={tela:'ranking'}; render(); }
function irTerritorio(id){ pararSolto(); view={tela:'territorio',terr:id}; render(); }
function irMateria(id){ pararSolto(); view={tela:'territorio',terr:id}; render(); tocarIntroMateria(id); }
function irMissao(tid,mid){ pararSolto(); view={tela:'missao',terr:tid,miss:mid}; render(); }
function zerar(){
  if(confirm('Recomeçar a expedição do zero? Todo o progresso será apagado.')){
    var idAparelho = estado.id;          // mantém a MESMA linha no placar da turma
    localStorage.removeItem(CHAVE); estado=novoEstado(); estado.id=idAparelho;
    salvar(); view={tela:'mapa'}; render();
  }
}

/* rede de segurança: se algo travar, mostra o erro NA TELA (fundo claro)
   em vez de deixar a tela escura vazia — ajuda a diagnosticar no celular */
function mostrarErro(txt){
  var el = document.getElementById('app');
  if(el) el.innerHTML =
    '<div style="background:#fff;color:#a00;padding:18px;border-radius:14px;'
    + 'margin:24px 0;font-size:14px;line-height:1.6">'
    + '<b>Ops! Algo travou ao abrir o StepQuest.</b><br>'
    + 'Tire um print desta tela e mostre para o papai:<br><br>'
    + '<code style="word-break:break-word">' + txt + '</code></div>';
}
window.onerror = function(msg,src,linha){ mostrarErro(msg + ' (linha ' + linha + ')'); };
window.addEventListener('online', function(){ if(estado.syncPend) enviarRanking(); });
try{ sanearMelhores(); if(estado.syncPend) enviarRanking(); render(); }
catch(e){ mostrarErro((e && e.message) ? e.message : String(e)); }
</script>
